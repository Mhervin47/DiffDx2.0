<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DiffDx — Pre-visit Clinical Check-in</title>
  <script>
    if (localStorage.getItem('theme') === 'light') {
      document.documentElement.classList.remove('dark-theme');
    } else {
      document.documentElement.classList.add('dark-theme');
    }
  </script>
  <link rel="stylesheet" href="/reloader.css">
  <script src="/reloader.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans:wght@400;500;600;700&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script src="/auth.js"></script>
  <style>
    /* ═════════════════════════════════════════════════════════
       DIFFDX CLINICAL INTAKE — LIGHT & DARK THEME SYSTEM
       ═════════════════════════════════════════════════════════ */
    :root {
      --bg-body: #F1F5F9;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --text-dim: #334155;
      --card-bg: #FFFFFF;
      --card-border: #E2E8F0;
      --border-card: #CBD5E1;
      --card-border-hover: rgba(13, 148, 136, 0.4);
      --surface-1: #FFFFFF;
      --surface-subtle: #F8FAFC;
      --surface-alt: #F1F5F9;
      --input-bg: #FFFFFF;
      --input-border: #CBD5E1;
      --input-text: #0F172A;
      --topbar-bg: rgba(255, 255, 255, 0.94);
      --nav-bg: rgba(255, 255, 255, 0.94);
      --nav-border: #E2E8F0;
      --card-shadow: 0 10px 30px -6px rgba(15, 23, 42, 0.08), 0 0 0 1px rgba(0, 0, 0, 0.03);
      --primary: #0D9488;
      --primary-light: #14B8A6;
      --primary-dark: #0F766E;
      --teal-primary: #0D9488;
      --blue-secondary: #2563EB;
      --glow-emerald: rgba(13, 148, 136, 0.16);
      --glow-ambient-1: rgba(13, 148, 136, 0.08);
      --glow-ambient-2: rgba(124, 58, 237, 0.06);
      --grid-opacity: 0.35;
      --chip-bg: rgba(13, 148, 136, 0.12);
      --chip-border: rgba(13, 148, 136, 0.32);
      --chip-text: #0F766E;
      --chip-del-hover: #DC2626;
      --notice-bg: rgba(124, 58, 237, 0.06);
      --notice-border: rgba(124, 58, 237, 0.22);
      --notice-text: #6D28D9;
      --btn-ghost-bg: #FFFFFF;
      --btn-ghost-border: #CBD5E1;
      --btn-ghost-text: #334155;
      --btn-ghost-hover: #F8FAFC;
      --stepper-bg: #FFFFFF;
      --stepper-border: #E2E8F0;
    }

    html.dark-theme {
      --bg-body: #080812;
      --text-main: #F1F5F9;
      --text-muted: #94A3B8;
      --text-dim: #CBD5E1;
      --card-bg: rgba(14, 27, 46, 0.72);
      --card-border: rgba(255, 255, 255, 0.08);
      --border-card: rgba(150, 180, 210, 0.12);
      --card-border-hover: rgba(16, 185, 129, 0.35);
      --surface-1: #0A1525;
      --surface-subtle: rgba(255, 255, 255, 0.03);
      --surface-alt: rgba(15, 23, 42, 0.6);
      --input-bg: rgba(15, 23, 42, 0.7);
      --input-border: rgba(255, 255, 255, 0.12);
      --input-text: #F1F5F9;
      --topbar-bg: rgba(9, 13, 22, 0.88);
      --nav-bg: rgba(9, 13, 22, 0.88);
      --nav-border: rgba(255, 255, 255, 0.08);
      --card-shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.03);
      --primary: #10B981;
      --primary-light: #34D399;
      --primary-dark: #059669;
      --teal-primary: #19C6AD;
      --blue-secondary: #4C8FF5;
      --glow-emerald: rgba(16, 185, 129, 0.25);
      --glow-ambient-1: rgba(16, 185, 129, 0.12);
      --glow-ambient-2: rgba(168, 85, 247, 0.10);
      --grid-opacity: 0.6;
      --chip-bg: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(20, 184, 166, 0.25));
      --chip-border: rgba(16, 185, 129, 0.35);
      --chip-text: #A7F3D0;
      --chip-del-hover: #EF4444;
      --notice-bg: rgba(168, 85, 247, 0.08);
      --notice-border: rgba(168, 85, 247, 0.22);
      --notice-text: #C084FC;
      --btn-ghost-bg: rgba(255, 255, 255, 0.05);
      --btn-ghost-border: rgba(255, 255, 255, 0.12);
      --btn-ghost-text: #CBD5E1;
      --btn-ghost-hover: rgba(255, 255, 255, 0.1);
      --stepper-bg: rgba(15, 23, 42, 0.65);
      --stepper-border: rgba(255, 255, 255, 0.08);
    }

    body {
      min-height: 100vh;
      background: var(--bg-body);
      color: var(--text-main);
      font-family: var(--font, 'Noto Sans', sans-serif);
      position: relative;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
      transition: background 0.25s ease, color 0.25s ease;
    }

    /* Ambient dynamic glow backdrops */
    .amb-glow-1 {
      position: fixed;
      top: -120px;
      right: 10%;
      width: 550px;
      height: 550px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--glow-ambient-1) 0%, transparent 70%);
      filter: blur(100px);
      pointer-events: none;
      z-index: 0;
      animation: floatGlow 18s ease-in-out infinite alternate;
    }
    .amb-glow-2 {
      position: fixed;
      bottom: -100px;
      left: 5%;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--glow-ambient-2) 0%, transparent 70%);
      filter: blur(95px);
      pointer-events: none;
      z-index: 0;
    }
    .amb-grid {
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(100, 116, 139, 0.12) 1px, transparent 1px);
      background-size: 36px 36px;
      pointer-events: none;
      z-index: 0;
      opacity: var(--grid-opacity);
      mask-image: radial-gradient(ellipse 90% 70% at 50% 30%, black 30%, transparent 95%);
    }

    @keyframes floatGlow {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, 40px) scale(1.08); }
      100% { transform: translate(-20px, 20px) scale(0.96); }
    }

    /* ═════════════════════════════════════════════════════════
       STANDARDIZED FULL-LENGTH TOPBAR
       ═════════════════════════════════════════════════════════ */
    .nav {
      position: sticky !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      transform: none !important;
      width: 100% !important;
      min-width: 0 !important;
      max-width: 100% !important;
      border-radius: 0 !important;
      margin: 0 !important;
      box-shadow: none !important;
      display: flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      padding: 0 38px !important;
      height: 72px !important;
      min-height: 72px !important;
      flex-shrink: 0 !important;
      z-index: 100 !important;
      background: var(--topbar-bg) !important;
      border: none !important;
      border-bottom: 1px solid var(--border-card) !important;
      backdrop-filter: blur(20px) !important;
      -webkit-backdrop-filter: blur(20px) !important;
      transition: background 0.3s ease, border-color 0.3s ease;
      box-sizing: border-box !important;
    }
    html.dark-theme .nav {
      background: rgba(9, 13, 22, 0.88) !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 28px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      text-decoration: none;
      transition: transform 0.2s ease;
    }
    .brand:hover {
      transform: translateY(-0.5px);
    }
    .brand-icon {
      filter: drop-shadow(0 0 8px rgba(15, 168, 141, 0.35));
      transition: transform 0.2s ease, filter 0.2s ease;
      width: 32px !important;
      height: 32px !important;
      flex-shrink: 0 !important;
    }
    .brand:hover .brand-icon {
      transform: scale(1.05);
      filter: drop-shadow(0 0 12px rgba(15, 168, 141, 0.55));
    }
    .brand-name {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
      font-size: 20px !important;
      font-weight: 800;
      letter-spacing: -0.035em;
      color: var(--text-main);
      line-height: 1;
    }
    .brand-accent {
      background: linear-gradient(100deg, var(--teal-primary) 0%, var(--blue-secondary) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Left-Aligned Patient Navigation Tabs (Sessions Only for Check-in) */
    .patient-nav-tabs {
      display: flex !important;
      align-items: center !important;
      gap: 6px !important;
      background: #ffffff !important;
      padding: 4px 6px !important;
      border-radius: 999px !important;
      border: 1px solid #dfe9ed !important;
      box-shadow: 0 4px 16px rgba(27, 67, 84, 0.06) !important;
      margin: 0 !important;
    }
    html.dark-theme .patient-nav-tabs {
      background: rgba(13, 20, 38, 0.45) !important;
      border-color: rgba(255, 255, 255, 0.1) !important;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4) !important;
    }

    .patient-nav-tab {
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 7px !important;
      padding: 6px 14px !important;
      border-radius: 999px !important;
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
      font-size: 12.5px !important;
      font-weight: 700 !important;
      line-height: 1 !important;
      color: #31445f !important;
      transition: all 0.2s ease !important;
      text-decoration: none !important;
      white-space: nowrap !important;
      box-sizing: border-box !important;
    }
    html.dark-theme .patient-nav-tab {
      color: #cbd5e1 !important;
    }
    .patient-nav-tab:hover {
      color: var(--teal-primary) !important;
      background: rgba(15, 168, 141, 0.08) !important;
    }
    html.dark-theme .patient-nav-tab:hover {
      color: #14b8a6 !important;
      background: rgba(20, 184, 166, 0.12) !important;
    }
    .patient-nav-tab.active {
      background: var(--teal-primary) !important;
      color: #ffffff !important;
      box-shadow: 0 2px 10px rgba(15, 168, 141, 0.28) !important;
    }
    html.dark-theme .patient-nav-tab.active {
      background: #14b8a6 !important;
      color: #03141f !important;
      box-shadow: 0 2px 14px rgba(20, 184, 166, 0.35) !important;
    }
    .patient-nav-tab svg {
      width: 14px !important;
      height: 14px !important;
      flex-shrink: 0 !important;
    }

    /* ═════════════════════════════════════════════════════════
       NAV RIGHT & EXACT TRIO ALIGNMENT: [ 🌙 ] [ 🔔 ] [ (U) User ⌵ ]
       ═════════════════════════════════════════════════════════ */
    .nav-right {
      display: flex !important;
      align-items: center !important;
      gap: 12px !important;
      margin-left: auto !important;
      height: 100% !important;
    }

    #nav-auth {
      display: flex !important;
      align-items: center !important;
      gap: 12px !important;
      margin: 0 !important;
      padding: 0 !important;
      height: 100% !important;
    }

    /* 38px Circular Action Buttons */
    .theme-toggle-btn,
    #theme-toggle,
    #nav-notif-btn,
    .nav-icon-btn {
      width: 38px !important;
      height: 38px !important;
      min-width: 38px !important;
      min-height: 38px !important;
      max-width: 38px !important;
      max-height: 38px !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      border-radius: 50% !important;
      background: #FFFFFF !important;
      border: 1px solid var(--border-card, #CBD5E1) !important;
      color: var(--text-dim, #334155) !important;
      cursor: pointer !important;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04) !important;
      transition: all .2s ease !important;
      flex-shrink: 0 !important;
      box-sizing: border-box !important;
      padding: 0 !important;
      margin: 0 !important;
      position: relative !important;
      text-decoration: none !important;
      line-height: 1 !important;
      vertical-align: middle !important;
    }
    .theme-toggle-btn:hover,
    #theme-toggle:hover,
    #nav-notif-btn:hover,
    .nav-icon-btn:hover {
      border-color: var(--teal-primary, #0D9488) !important;
      color: var(--teal-primary, #0D9488) !important;
      transform: scale(1.05) !important;
    }

    #nav-notif-btn svg {
      width: 17px !important;
      height: 17px !important;
      display: block !important;
      flex-shrink: 0 !important;
      stroke-width: 2.2 !important;
    }

    .theme-toggle-btn svg {
      width: 16px !important;
      height: 16px !important;
      display: block !important;
      flex-shrink: 0 !important;
    }
    html.dark-theme .sun-icon { display: block !important; }
    html.dark-theme .moon-icon { display: none !important; }
    html:not(.dark-theme) .sun-icon { display: none !important; }
    html:not(.dark-theme) .moon-icon { display: block !important; }

    /* User Profile Pill Button */
    .nav-user-menu {
      position: relative !important;
      display: inline-flex !important;
      align-items: center !important;
      margin: 0 !important;
      padding: 0 !important;
      height: 38px !important;
    }

    .nav-user-btn {
      display: inline-flex !important;
      align-items: center !important;
      gap: 10px !important;
      height: 38px !important;
      min-height: 38px !important;
      max-height: 38px !important;
      box-sizing: border-box !important;
      padding: 0 14px 0 2.5px !important;
      margin: 0 !important;
      background: #FFFFFF !important;
      border: 1px solid var(--border-card, #CBD5E1) !important;
      border-radius: 9999px !important;
      cursor: pointer !important;
      color: var(--text-main, #0F172A) !important;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04) !important;
      transition: all .2s ease !important;
      line-height: 1 !important;
      vertical-align: middle !important;
      text-decoration: none !important;
    }
    .nav-user-btn:hover {
      border-color: var(--teal-primary, #0D9488) !important;
      transform: translateY(-0.5px) !important;
    }

    .nav-user-avatar {
      width: 32px !important;
      height: 32px !important;
      min-width: 32px !important;
      min-height: 32px !important;
      max-width: 32px !important;
      max-height: 32px !important;
      border-radius: 50% !important;
      background: linear-gradient(135deg, #0fa88d 0%, #2563eb 100%) !important;
      color: #ffffff !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      font-family: 'Sora', 'Manrope', sans-serif !important;
      font-weight: 800 !important;
      font-size: 14px !important;
      line-height: 1 !important;
      flex-shrink: 0 !important;
      box-shadow: 0 1px 4px rgba(15, 168, 141, 0.25) !important;
    }

    .nav-user-name {
      font-family: 'Sora', 'Manrope', system-ui, sans-serif !important;
      font-size: 14.5px !important;
      font-weight: 800 !important;
      letter-spacing: -0.015em !important;
      color: var(--text-main, #0F172A) !important;
      line-height: 1 !important;
      white-space: nowrap !important;
      display: inline-flex !important;
      align-items: center !important;
    }

    .nav-user-btn svg {
      width: 12px !important;
      height: 12px !important;
      stroke-width: 2.5 !important;
      color: var(--text-muted, #475569) !important;
      display: inline-block !important;
      flex-shrink: 0 !important;
      transition: transform .2s ease !important;
    }
    .nav-user-btn[aria-expanded="true"] svg {
      transform: rotate(180deg) !important;
    }

    /* Dark theme overrides for the right nav cluster */
    html.dark-theme .theme-toggle-btn,
    html.dark-theme #theme-toggle,
    html.dark-theme #nav-notif-btn,
    html.dark-theme .nav-icon-btn {
      background: rgba(255, 255, 255, 0.06) !important;
      border-color: rgba(255, 255, 255, 0.12) !important;
      color: #cbd5e1 !important;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4) !important;
    }
    html.dark-theme .theme-toggle-btn:hover,
    html.dark-theme #theme-toggle:hover,
    html.dark-theme #nav-notif-btn:hover,
    html.dark-theme .nav-icon-btn:hover {
      background: rgba(16, 185, 129, 0.15) !important;
      border-color: #10b981 !important;
      color: #34d399 !important;
    }

    html.dark-theme .nav-user-btn {
      background: rgba(255, 255, 255, 0.06) !important;
      border-color: rgba(255, 255, 255, 0.12) !important;
      color: #f1f5f9 !important;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4) !important;
    }
    html.dark-theme .nav-user-btn:hover {
      background: rgba(255, 255, 255, 0.10) !important;
      border-color: #10b981 !important;
    }
    html.dark-theme .nav-user-name {
      color: #f1f5f9 !important;
    }
    html.dark-theme .nav-user-btn svg {
      color: #94a3b8 !important;
    }

    @media (max-width: 960px) {
      .nav { padding: 0 20px !important; }
      .brand-section { gap: 16px; }
      .patient-nav-tabs span { display: none; }
      .patient-nav-tab { padding: 6px 10px !important; }
    }
    @media (max-width: 680px) {
      .patient-nav-tabs { display: none !important; }
    }

    /* ═════════════════════════════════════════════════════════
       MAIN WIZARD CONTAINER & CONTENT
       ═════════════════════════════════════════════════════════ */
    .wiz-wrap {
      max-width: 740px;
      margin: 36px auto 60px;
      padding: 0 20px;
      position: relative;
      z-index: 1;
    }

    /* Header banner */
    .wiz-header {
      margin-bottom: 24px;
      text-align: center;
    }
    .wiz-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(13, 148, 136, 0.10);
      border: 1px solid rgba(13, 148, 136, 0.28);
      border-radius: 9999px;
      padding: 5px 14px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--primary);
      margin-bottom: 12px;
      backdrop-filter: blur(12px);
    }
    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--primary);
      box-shadow: 0 0 10px var(--primary);
      animation: pulseAnim 2s infinite ease-in-out;
    }
    @keyframes pulseAnim {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }
    .wiz-main-title {
      font-family: 'Sora', sans-serif;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-main);
      margin-bottom: 6px;
    }
    .wiz-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      max-width: 460px;
      margin: 0 auto;
      line-height: 1.5;
    }

    /* Stepper Navigation */
    .stepper-nav {
      background: var(--stepper-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--stepper-border);
      border-radius: 20px;
      padding: 14px 18px;
      margin-bottom: 24px;
      box-shadow: var(--card-shadow);
      transition: background 0.25s, border-color 0.25s;
    }
    .steps-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr auto 1fr;
      align-items: center;
      gap: 10px;
    }
    .step-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 10px;
      border-radius: 12px;
      transition: all 0.25s ease;
      cursor: default;
    }
    .step-item.is-active {
      background: rgba(13, 148, 136, 0.08);
      border: 1px solid rgba(13, 148, 136, 0.22);
    }
    .step-item.is-clickable {
      cursor: pointer;
    }
    .step-num-bubble {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Sora', sans-serif;
      font-size: 13px;
      font-weight: 700;
      background: var(--surface-subtle);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      flex-shrink: 0;
      transition: all 0.25s ease;
    }
    .step-item.is-active .step-num-bubble {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border-color: var(--primary-light);
      color: #ffffff;
      box-shadow: 0 0 16px var(--glow-emerald);
    }
    .step-item.is-done .step-num-bubble {
      background: rgba(13, 148, 136, 0.16);
      border-color: rgba(13, 148, 136, 0.4);
      color: var(--primary);
    }
    .step-text-meta {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .step-step-idx {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .step-item.is-active .step-step-idx {
      color: var(--primary);
    }
    .step-title-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .step-item.is-active .step-title-name {
      color: var(--text-main);
      font-weight: 700;
    }
    .step-connector {
      width: 24px;
      height: 2px;
      background: var(--card-border);
      border-radius: 99px;
      position: relative;
    }

<div class="wiz-wrap">
  <!-- Top Title Banner -->

    <p class="wiz-subtitle">Provide your current symptoms and health updates to help your clinical team prepare for your appointment.</p>

  <div class="stepper-nav">

      <div class="step-item is-active" id="step-nav-1" onclick="if(step>1)goToStep(1)">
        <div class="step-num-bubble" id="step-bubble-1">1</div>
        <div class="step-text-meta">
          <span class="step-step-idx">Step 1</span>
          <span class="step-title-name">Vitals & Symptoms</span>

      <div class="step-item" id="step-nav-2" onclick="if(step>2)goToStep(2)">
        <div class="step-num-bubble" id="step-bubble-2">2</div>

          <span class="step-title-name">Meds & History</span>

      <div class="step-item" id="step-nav-3">
        <div class="step-num-bubble" id="step-bubble-3">3</div>

          <span class="step-step-idx">Step 3</span>
          <span class="step-title-name">Review & Submit</span>
        </div>

  <!-- Main Step Card Container -->
  <div class="card-glass" id="wiz-card">

<script>
// Theme Toggle Function (Standard across all DiffDx pages)
function toggleTheme() {
  const isDark = document.documentElement.classList.toggle('dark-theme');
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}

const user = typeof getAuthUser === 'function' ? getAuthUser() : null;
const params = new URLSearchParams(location.search);
const apptId = params.get('appt');

if (!user) {
  window.location.replace('/login.html?next=' + encodeURIComponent(location.pathname + location.search));
}

let step = 1;
const state = {
  feeling: '',
  symptoms: [],
  severity: 5,
  changes: '',
  medications: [],
  allergies: '',
  tests_done: [],
};

const FEELINGS = [
  {
    key: 'Very Good',
    color: '#10b981',
    svg: `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 13.5c1.5 2.5 6.5 2.5 8 0"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>`
  },
  {
    key: 'Good',
    color: '#14b8a6',
    svg: `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>`
  },
  {
    key: 'Neutral',
    color: '#f59e0b',
    svg: `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="8" y1="15" x2="16" y2="15"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>`
  },
  {
    key: 'Poor',
    color: '#f97316',
    svg: `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M16 16s-1.5-2-4-2-4 2-4 2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>`
  },
  {
    key: 'Very Poor',
    color: '#ef4444',
    svg: `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M16 17c-1.5-2.5-6.5-2.5-8 0"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>`
  }
];

const TESTS_CATALOG = [
  { name: 'Blood Work', icon: '🩸', desc: 'CBC, Metabolic panel' },
  { name: 'X-ray', icon: '🩻', desc: 'Chest or limb scan' },
  { name: 'MRI', icon: '🧠', desc: 'Magnetic resonance' },
  { name: 'ECG', icon: '💓', desc: 'Cardiovascular check' },
  { name: 'Urine Test', icon: '🧪', desc: 'Urinalysis' },
  { name: 'Ultrasound', icon: '📡', desc: 'Sonogram imaging' }
];

const COMMON_SYMPTOMS = ['Headache', 'Fever', 'Fatigue', 'Cough', 'Body Aches', 'Shortness of breath', 'Nausea'];

function escHtml(s) {
  return (s || '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function getSeverityDetails(val) {
  const v = parseInt(val, 10);
  if (v <= 3) return { label: 'Mild Discomfort', bg: 'rgba(16, 185, 129, 0.15)', text: '#059669', border: 'rgba(16, 185, 129, 0.35)' };
  if (v <= 6) return { label: 'Moderate Symptoms', bg: 'rgba(245, 158, 11, 0.15)', text: '#d97706', border: 'rgba(245, 158, 11, 0.35)' };
  if (v <= 8) return { label: 'Severe / Acute', bg: 'rgba(249, 115, 22, 0.15)', text: '#ea580c', border: 'rgba(249, 115, 22, 0.35)' };
  return { label: 'Critical / Urgent', bg: 'rgba(239, 68, 68, 0.18)', text: '#dc2626', border: 'rgba(239, 68, 68, 0.45)' };
}

function updateStepperUI() {
  for (let i = 1; i <= 3; i++) {
    const item = document.getElementById('step-nav-' + i);
    const bubble = document.getElementById('step-bubble-' + i);
    if (!item || !bubble) continue;

    item.classList.remove('is-active', 'is-done', 'is-clickable');

    if (i === step) {
      item.classList.add('is-active');
      bubble.innerHTML = i;
    } else if (i < step) {
      item.classList.add('is-done', 'is-clickable');
      bubble.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
    } else {
      bubble.innerHTML = i;
    }
  }

  const c1 = document.getElementById('connector-1');
  const c2 = document.getElementById('connector-2');
  if (c1) c1.className = 'step-connector' + (step >= 2 ? ' is-done' : '');
  if (c2) c2.className = 'step-connector' + (step >= 3 ? ' is-done' : '');
}

function goToStep(s) {
  if (s >= 1 && s <= 3) {
    step = s;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function render() {
  updateStepperUI();
  const body = document.getElementById('wiz-body');
  if (step === 1) body.innerHTML = renderStep1();
  else if (step === 2) body.innerHTML = renderStep2();
  else if (step === 3) body.innerHTML = renderStep3();
  else body.innerHTML = renderSuccess();
}

function renderStep1() {
  const sev = getSeverityDetails(state.severity);

  return `
    <div class="form-heading">
      <div class="form-heading-title">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
        Current Condition & Symptoms
      </div>
      <div class="form-heading-desc">Tell us how you are feeling today and describe any current symptoms.</div>
    </div>

    <!-- Feeling Selection -->
    <div class="field-group">
      <div class="field-label-row">
        <label class="field-label">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/></svg>
          Overall Feeling Today
        </label>
        <span class="field-hint">Required</span>
      </div>
      <div class="feeling-grid">
        ${FEELINGS.map(f => {
          const isAct = state.feeling === f.key;
          return `
            <div class="feel-card ${isAct ? 'active' : ''}" data-feel="${f.key}" onclick="setFeeling('${f.key}')">
              <div class="feel-icon-wrap" style="color: ${f.color}">
                ${f.svg}
              </div>
              <div class="feel-label">${f.key}</div>
            </div>`;
        }).join('')}
      </div>
    </div>

    <!-- Symptoms Chip Input -->
    <div class="field-group">
      <div class="field-label-row">
        <label class="field-label">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
          Active Symptoms
        </label>
        <span class="field-hint">Press Enter or click suggestions</span>
      </div>
      <div class="chip-container" onclick="document.getElementById('sym-input').focus()">
        ${state.symptoms.map((s, idx) => `
          <span class="tag-chip">
            ${escHtml(s)}
            <button type="button" title="Remove" onclick="removeSymptom(${idx}); event.stopPropagation();">&times;</button>
          </span>
        `).join('')}
        <input id="sym-input" type="text" placeholder="${state.symptoms.length ? 'Add another symptom...' : 'e.g. Headache, Dry cough, Nausea'}" onkeydown="symKey(event)">
      </div>
      <div class="suggested-symptoms">
        <span class="suggested-label">Quick add:</span>
        ${COMMON_SYMPTOMS.map(item => `
          <button type="button" class="sugg-pill" onclick="addSuggestedSymptom('${item}')">+ ${item}</button>
        `).join('')}
      </div>
    </div>

    <!-- Severity Slider -->
    <div class="field-group">
      <div class="severity-panel">
        <div class="sev-header">
          <div>
            <div class="field-label" style="margin-bottom: 2px;">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
              Symptom Severity Scale
            </div>
            <div class="field-hint">Rate your general distress level</div>
          </div>
          <div style="display:flex; align-items:center; gap:12px;">
            <div class="sev-status-badge" id="sev-badge" style="background:${sev.bg}; color:${sev.text}; border:1px solid ${sev.border}">
              ${sev.label}
            </div>
            <div class="sev-val-bubble" id="sev-val-display">${state.severity} <span style="font-size:13px; color:var(--text-muted); font-weight:500;">/10</span></div>
          </div>
        </div>

        <div class="slider-track-wrap">
          <input type="range" min="1" max="10" value="${state.severity}" class="sev-slider" oninput="setSeverity(this.value)">
        </div>
        <div class="slider-ticks">
          <span>1 (Mild)</span>
          <span>5 (Moderate)</span>
          <span>10 (Severe)</span>
        </div>
      </div>
    </div>

    <!-- Changes Since Last Visit -->
    <div class="field-group" style="margin-bottom: 8px;">
      <div class="field-label-row">
        <label class="field-label">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
          Progression Since Last Visit
        </label>
        <span class="field-hint">Clinical trend</span>
      </div>
      <div class="radio-grid">
        ${[
          { key: 'Better', icon: '🌿' },
          { key: 'Same', icon: '⚖️' },
          { key: 'Worse', icon: '⚠️' },
          { key: 'First Visit', icon: '🆕' }
        ].map(item => `
          <div class="radio-card ${state.changes === item.key ? 'active' : ''}" onclick="setChanges('${item.key}')">
            <div class="radio-dot"></div>
            <span>${item.icon} ${item.key}</span>
          </div>
        `).join('')}
      </div>
    </div>

    <!-- Wizard Action Footer -->
    <div class="wiz-actions-bar">
      <div></div>
      <button class="btn-wiz-primary" onclick="next()">
        Continue to Meds & History
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>`;
}

function renderStep2() {
  return `
    <div class="form-heading">
      <div class="form-heading-title">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="m9 12 2 2 4-4"/></svg>
        Medications & Clinical History
      </div>
      <div class="form-heading-desc">List what you are currently taking, known allergies, and any recent lab or imaging tests.</div>
    </div>

    <!-- Current Medications -->
    <div class="field-group">
      <div class="field-label-row">
        <label class="field-label">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/></svg>
          Current Medications & Dosages
        </label>
        <span class="field-hint">Prescription or over-the-counter</span>
      </div>
      <div class="med-add-row">
        <input id="med-input" class="med-input-box" type="text" placeholder="e.g. Lisinopril 10mg once daily, Aspirin 81mg" onkeydown="if(event.key==='Enter')addMed()">
        <button type="button" class="btn-add-med" onclick="addMed()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add Med
        </button>
      </div>

      <div class="suggested-symptoms" style="margin-bottom: 12px;">
        <span class="suggested-label">Quick suggestions:</span>
        <button type="button" class="sugg-pill" onclick="addSuggestedMed('Paracetamol 500mg')">+ Paracetamol 500mg</button>
        <button type="button" class="sugg-pill" onclick="addSuggestedMed('Ibuprofen 400mg')">+ Ibuprofen 400mg</button>
        <button type="button" class="sugg-pill" onclick="addSuggestedMed('Amoxicillin 500mg')">+ Amoxicillin 500mg</button>
        <button type="button" class="sugg-pill" onclick="addSuggestedMed('None')">+ No Medications</button>
      </div>

      <div class="meds-list" id="meds-container">
        ${state.medications.length ? state.medications.map((m, idx) => `
          <div class="med-card">
            <div class="med-card-left">
              <span class="med-card-icon">💊</span>
              <span style="font-weight: 600;">${escHtml(m)}</span>
            </div>
            <button class="med-delete-btn" title="Remove medication" onclick="removeMed(${idx})">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </button>
          </div>
        `).join('') : `
          <div style="font-size:12px; color:var(--text-muted); padding: 12px 14px; background:var(--surface-subtle); border-radius:12px; border:1px dashed var(--card-border);">
            No medications added yet. Type above to add, or skip if none.
          </div>
        `}
      </div>
    </div>

    <!-- Known Allergies -->
    <div class="field-group">
      <div class="field-label-row">
        <label class="field-label">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          Known Allergies
        </label>
        <span class="field-hint">Drugs, food, environmental</span>
      </div>
      <textarea class="allergies-box" id="allergy-ta" placeholder="e.g. Penicillin (rash), Peanuts, Latex, Sulfa drugs — or 'No known allergies'" oninput="state.allergies=this.value">${escHtml(state.allergies)}</textarea>
      <div class="suggested-symptoms" style="margin-top: 6px;">
        <span class="suggested-label">Quick fill:</span>
        <button type="button" class="sugg-pill" onclick="setAllergyQuick('No Known Drug Allergies (NKDA)')">No Known Allergies (NKDA)</button>
        <button type="button" class="sugg-pill" onclick="appendAllergy('Penicillin')">+ Penicillin</button>
        <button type="button" class="sugg-pill" onclick="appendAllergy('Sulfa')">+ Sulfa</button>
      </div>
    </div>

    <!-- Diagnostic Tests Done Recently -->
    <div class="field-group" style="margin-bottom: 8px;">
      <div class="field-label-row">
        <label class="field-label">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
          Recent Tests Done (Last 30 Days)
        </label>
        <span class="field-hint">Select all that apply</span>
      </div>
      <div class="tests-grid">
        ${TESTS_CATALOG.map(t => {
          const isAct = state.tests_done.includes(t.name);
          return `
            <div class="test-pill-card ${isAct ? 'active' : ''}" onclick="toggleTest('${t.name}')">
              <span class="test-check-box">
                ${isAct ? `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>` : ''}
              </span>
              <div style="flex:1; min-width:0;">
                <div style="font-weight:600; color:var(--text-main); font-size:13px;">${t.icon} ${t.name}</div>
                <div style="font-size:10px; color:var(--text-muted);">${t.desc}</div>

            </div>`;
        }).join('')}
      </div>

    <!-- Wizard Actions Footer -->
    <div class="wiz-actions-bar">
      <button class="btn-wiz-ghost" onclick="back()">

        Back
      </button>
      <button class="btn-wiz-primary" onclick="next()">
        Review & Finalize
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>`;
}

function renderStep3() {
  const sev = getSeverityDetails(state.severity);

  return `
    <div class="form-heading">
      <div class="form-heading-title">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        Review & Submit Check-in
      </div>
      <div class="form-heading-desc">Please verify your clinical summary before submitting to your physician.</div>
    </div>

    <div class="review-grid">
      <!-- Section 1: Symptoms -->
      <div class="review-section-card">
        <div class="review-header-line">
          <div class="review-sec-title">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>

          </div>
          <button class="review-edit-btn" onclick="goToStep(1)">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            Edit
          </button>
        </div>
        <div class="review-data-row">
          <div class="review-data-key">Overall Feeling</div>
          <div class="review-data-val">
            <span style="font-weight:700; color:var(--primary);">${escHtml(state.feeling) || '<span style="color:var(--text-muted)">Not specified</span>'}</span>
          </div>
        </div>
        <div class="review-data-row">
          <div class="review-data-key">Active Symptoms</div>
          <div class="review-data-val">
            ${state.symptoms.length ? state.symptoms.map(s => `<span class="tag-chip" style="font-size:11px; padding:2px 8px; margin:2px 4px 2px 0;">${escHtml(s)}</span>`).join('') : '<span style="color:var(--text-muted)">None specified</span>'}
          </div>
        </div>
        <div class="review-data-row">
          <div class="review-data-key">Severity Level</div>
          <div class="review-data-val">
            <span style="display:inline-flex; align-items:center; gap:6px;">
              <strong style="color:${sev.text}">${state.severity} / 10</strong>
              <span style="font-size:11px; color:var(--text-muted);">(${sev.label})</span>
            </span>
          </div>
        </div>
        <div class="review-data-row">
          <div class="review-data-key">Progression</div>
          <div class="review-data-val">
            <span style="font-weight:600; color:var(--text-main);">${escHtml(state.changes) || '<span style="color:var(--text-muted)">Not recorded</span>'}</span>
          </div>
        </div>
      </div>

      <!-- Section 2: Clinical History -->
      <div class="review-section-card">
        <div class="review-header-line">
          <div class="review-sec-title">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/></svg>
            Medications, Allergies & Tests
          </div>
          <button class="review-edit-btn" onclick="goToStep(2)">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            Edit
          </button>
        </div>
        <div class="review-data-row">
          <div class="review-data-key">Current Medications</div>
          <div class="review-data-val">
            ${state.medications.length ? state.medications.map(m => `<div>💊 ${escHtml(m)}</div>`).join('') : '<span style="color:var(--text-muted)">None listed</span>'}
          </div>
        </div>
        <div class="review-data-row">
          <div class="review-data-key">Known Allergies</div>
          <div class="review-data-val">
            ${state.allergies ? `<span style="color:#d97706; font-weight:600;">⚠️ ${escHtml(state.allergies)}</span>` : '<span style="color:var(--text-muted)">None reported</span>'}
          </div>
        </div>
        <div class="review-data-row">
          <div class="review-data-key">Recent Tests Done</div>
          <div class="review-data-val">
            ${state.tests_done.length ? state.tests_done.join(', ') : '<span style="color:var(--text-muted)">No recent tests recorded</span>'}
          </div>
        </div>
      </div>
    </div>

    <!-- HIPAA & Privacy Notice -->
    <div class="privacy-notice">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <div>
        <strong>End-to-End Clinical Encryption:</strong> Your pre-visit intake details are securely transmitted to your physician's clinical portal in compliance with HIPAA privacy standards.
      </div>
    </div>

    <!-- Wizard Actions Footer -->
    <div class="wiz-actions-bar">
      <button class="btn-wiz-ghost" onclick="back()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
        Back
      </button>
      <button class="btn-wiz-primary" id="submit-btn" onclick="submit()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        Submit to Doctor

}

function renderSuccess() {
  return `
    <div class="success-container">
      <div class="success-shield">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <polyline points="9 12 11 14 15 10"/>
        </svg>
      </div>
      <h2 class="success-title">Pre-visit Check-in Complete!</h2>
      <p class="success-desc">Your clinical update has been synchronized with your upcoming appointment. Your care team will review these details before seeing you.</p>

      <div style="background:var(--surface-subtle); border:1px solid var(--card-border); border-radius:16px; padding:16px 20px; max-width:440px; margin:0 auto 28px; text-align:left; font-size:13px;">
        <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
          <span style="color:var(--text-muted);">Appointment Reference</span>
          <span style="font-family:monospace; color:var(--primary); font-weight:600;">${escHtml(apptId || 'APPT-SCHEDULED')}</span>
        </div>
        <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
          <span style="color:var(--text-muted);">Intake Status</span>
          <span style="color:var(--primary); font-weight:700;">Verified & Ready</span>
        </div>
        <div style="display:flex; justify-content:space-between;">
          <span style="color:var(--text-muted);">Overall Feeling Recorded</span>
          <span style="font-weight:600; color:var(--text-main);">${escHtml(state.feeling) || 'Recorded'}</span>
        </div>
      </div>

      <div class="success-actions">
        <a class="btn-wiz-ghost" href="/my-profile.html" style="text-decoration:none;">View My Profile</a>
        <a class="btn-wiz-primary" href="/my-sessions.html" style="text-decoration:none;">Return to My Sessions</a>
      </div>
    </div>`;
}

// ---- Interactive State Actions ----
function setFeeling(k) {
  state.feeling = k;
  render();
}

function symKey(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    const v = e.target.value.trim();
    if (v && !state.symptoms.includes(v)) {
      state.symptoms.push(v);
      render();
      const inp = document.getElementById('sym-input');
      if (inp) inp.focus();
    } else {
      e.target.value = '';
    }
  }
}

function addSuggestedSymptom(name) {
  if (!state.symptoms.includes(name)) {
    state.symptoms.push(name);
    render();
    const inp = document.getElementById('sym-input');
    if (inp) inp.focus();
  }
}

function removeSymptom(i) {
  state.symptoms.splice(i, 1);
  render();
}

function setSeverity(v) {
  state.severity = parseInt(v, 10);
  const sev = getSeverityDetails(state.severity);
  const valDisplay = document.getElementById('sev-val-display');
  const badge = document.getElementById('sev-badge');
  if (valDisplay) valDisplay.innerHTML = `${state.severity} <span style="font-size:13px; color:var(--text-muted); font-weight:500;">/10</span>`;
  if (badge) {
    badge.textContent = sev.label;
    badge.style.background = sev.bg;
    badge.style.color = sev.text;
    badge.style.borderColor = sev.border;
  }
}

function setChanges(c) {
  state.changes = c;
  render();
}

function addMed() {
  const inp = document.getElementById('med-input');
  if (!inp) return;
  const v = inp.value.trim();
  if (v && !state.medications.includes(v)) {
    state.medications.push(v);
    render();
    const nextInp = document.getElementById('med-input');
    if (nextInp) nextInp.focus();
  }
}

function addSuggestedMed(med) {
  if (!state.medications.includes(med)) {
    state.medications.push(med);
    render();
  }
}

function removeMed(i) {
  state.medications.splice(i, 1);
  render();
}

function setAllergyQuick(txt) {
  state.allergies = txt;
  const ta = document.getElementById('allergy-ta');
  if (ta) ta.value = txt;
}

function appendAllergy(item) {
  let current = (state.allergies || '').trim();
  if (!current || current === 'No Known Drug Allergies (NKDA)') {
    state.allergies = item;
  } else if (!current.toLowerCase().includes(item.toLowerCase())) {
    state.allergies = current + ', ' + item;
  }
  const ta = document.getElementById('allergy-ta');
  if (ta) ta.value = state.allergies;
}

function toggleTest(t) {
  const idx = state.tests_done.indexOf(t);
  if (idx >= 0) state.tests_done.splice(idx, 1);
  else state.tests_done.push(t);
  render();
}

function next() {
  if (step === 1 && !state.feeling) {
    alert('Please select how you are feeling today before continuing.');
    return;
  }
  step++;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function back() {
  if (step > 1) {
    step--;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

async function submit() {
  if (!apptId) {
    alert('Missing appointment reference ID. Please launch this page from your sessions page.');
    return;
  }

  const btn = document.getElementById('submit-btn');
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = `<span style="display:inline-block; animation:spin 1s linear infinite; margin-right:6px;">↻</span> Submitting Check-in...`;
  }

  try {
    const res = await fetch(`/api/patient/appointments/${apptId}/intake`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        ...(typeof authHeaders === 'function' ? authHeaders() : {})
      },
      body: JSON.stringify({
        feeling: state.feeling,
        symptoms: state.symptoms,
        severity: state.severity,
        changes: state.changes,
        medications: state.medications,
        allergies: state.allergies,
        tests_done: state.tests_done
      }),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || 'Failed to submit pre-visit intake');
    }

    step = 4;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (e) {
    alert('Submission failed: ' + e.message);
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = 'Submit to Doctor';
    }
  }
}

// Initial render
render();
</script>

</html>
