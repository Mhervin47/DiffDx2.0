<!DOCTYPE html>
<html lang="en" class="dark-theme">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DiffDx Admin — AI Quality</title>
<script>
  if (localStorage.getItem('theme') === 'light') {
    document.documentElement.classList.remove('dark-theme');
  } else {
    document.documentElement.classList.add('dark-theme');
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Noto+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-dark: #F1F5F9;
    --bg-card: #FFFFFF;
    --surface-1: #FFFFFF;
    --surface-2: #F8FAFC;
    --surface-3: #F1F5F9;
    --border-card: #CBD5E1;
    --border: #CBD5E1;
    --teal-primary: #0D9488;
    --teal-glow: rgba(13, 148, 136, 0.15);
    --teal-dim: rgba(13, 148, 136, 0.12);
    --blue-secondary: #2563EB;
    --purple-accent: #6D28D9;
    --warn: #D97706;
    --warn-dim: rgba(217, 119, 6, 0.08);
    --warn-border: rgba(217, 119, 6, 0.30);
    --danger: #EF4444;
    --well: #0D9488;
    --over: #D97706;
    --under: #2563EB;
    --text-main: #0F172A;
    --text-muted: #475569;
    --text-dim: #64748B;
    --nav-bg: rgba(255, 255, 255, 0.92);
    --card-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.06), 0 2px 6px -1px rgba(15, 23, 42, 0.04);
    --input-bg: #F8FAFC;
    --font-heading: 'Sora', sans-serif;
    --font-body: 'Noto Sans', sans-serif;
  }

  html.dark-theme {
    --bg-dark: #050D18;
    --bg-card: #0A1525;
    --surface-1: #0A1525;
    --surface-2: #0E1B2E;
    --surface-3: #13243C;
    --border-card: rgba(150, 180, 210, 0.10);
    --border: rgba(150, 180, 210, 0.12);
    --teal-primary: #19C6AD;
    --teal-glow: rgba(25, 198, 173, 0.20);
    --teal-dim: rgba(25, 198, 173, 0.12);
    --blue-secondary: #4C8FF5;
    --purple-accent: #8174E8;
    --warn: #F59E0B;
    --warn-dim: rgba(245, 158, 11, 0.08);
    --warn-border: rgba(245, 158, 11, 0.30);
    --danger: #EF4444;
    --well: #10B981;
    --over: #F59E0B;
    --under: #4C8FF5;
    --text-main: #EAF2FA;
    --text-muted: #8FA2B9;
    --text-dim: #64748B;
    --nav-bg: rgba(5, 13, 24, 0.85);
    --card-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
    --input-bg: #0C192A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg-dark);
    color: var(--text-main);
    font-family: var(--font-body);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
    -webkit-font-smoothing: antialiased;
    transition: background 0.3s ease, color 0.3s ease;
  }

  /* Ambient Background Overlays */
  .bg-grid {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image: radial-gradient(rgba(143, 162, 185, 0.06) 1px, transparent 1px);
    background-size: 32px 32px;
    mask-image: radial-gradient(ellipse 85% 65% at 50% 30%, black 40%, transparent 95%);
  }
  html:not(.dark-theme) .bg-grid {
    background-image: radial-gradient(rgba(15, 23, 42, 0.05) 1px, transparent 1px);
  }

  .bg-glow-left {
    position: fixed; top: -120px; left: -120px; width: 650px; height: 650px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(25, 198, 173, 0.12) 0%, transparent 70%);
    filter: blur(100px); pointer-events: none; z-index: 0;
  }
  html:not(.dark-theme) .bg-glow-left {
    background: radial-gradient(circle, rgba(13, 148, 136, 0.08) 0%, transparent 70%);
  }

  .bg-glow-right {
    position: fixed; top: 180px; right: -120px; width: 700px; height: 700px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(129, 116, 232, 0.09) 0%, transparent 70%);
    filter: blur(120px); pointer-events: none; z-index: 0;
  }
  html:not(.dark-theme) .bg-glow-right {
    background: radial-gradient(circle, rgba(109, 40, 217, 0.06) 0%, transparent 70%);
  }

  /* Brand Topbar */
  .admin-topbar {
    position: sticky; top: 0; z-index: 100;
    background: var(--nav-bg);
    backdrop-filter: blur(20px) saturate(1.8);
    -webkit-backdrop-filter: blur(20px) saturate(1.8);
    border-bottom: 1px solid var(--border-card);
    padding: 0 32px; height: 60px;
    display: flex; align-items: center; justify-content: space-between;
    transition: background 0.3s ease, border-color 0.3s ease;
  }
  .topbar-brand {
    display: inline-flex; align-items: center; gap: 12px;
  }
  .brand-logo-link {
    display: inline-flex; align-items: center; gap: 10px;
    text-decoration: none;
  }
  .logo-symbol {
    width: 28px; height: 28px;
    filter: drop-shadow(0 0 10px rgba(25, 198, 173, 0.45));
  }
  .logo-text {
    font-family: var(--font-heading); font-size: 18px; font-weight: 800;
    color: var(--text-main); letter-spacing: -.03em;
  }
  .logo-accent {
    background: linear-gradient(90deg, #19C6AD, #4C8FF5);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .admin-badge {
    font-family: var(--font-heading); font-size: 10px; font-weight: 800;
    padding: 3px 9px; border-radius: 9999px;
    background: var(--teal-dim); color: var(--teal-primary);
    border: 1px solid rgba(25, 198, 173, 0.3); letter-spacing: .06em;
  }
  .topbar-actions {
    display: flex; align-items: center; gap: 10px;
  }
  .topbar-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 15px; border-radius: 9999px;
    background: var(--surface-2);
    border: 1px solid var(--border-card);
    color: var(--text-muted); font-family: var(--font-heading);
    font-size: 12.5px; font-weight: 600; text-decoration: none;
    transition: all 0.2s ease;
  }
  .topbar-btn:hover {
    color: var(--teal-primary);
    border-color: var(--teal-primary);
    background: var(--teal-dim);
  }
  .currency-toggle-btn { cursor: pointer; outline: none; appearance: none; -webkit-appearance: none; }

  /* Shared auth nav — user dropdown menu (admin_portal has its own design
     tokens, mapped onto the same class names auth.js's initAuthNav()
     markup uses everywhere else in the app: --primary -> --teal-primary,
     --border -> --border-card, --font-headline -> --font-heading, etc.
     A logged-in doctor or patient can technically land on this public page
     shell too, so all three of initAuthNav()'s branches need to render
     correctly here, not just the admin one. */
  .nav-user-menu { position: relative; display: inline-flex; align-items: center; }
  .nav-user-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--surface-2);
    border: 1px solid var(--border-card);
    border-radius: 9999px; padding: 4px 12px 4px 4px;
    cursor: pointer; color: var(--text-main);
    font-family: var(--font-heading); font-size: 13px;
    transition: all 0.2s ease;
  }
  .nav-user-btn:hover {
    border-color: var(--teal-primary);
    color: var(--teal-primary);
    background: var(--teal-dim);
  }
  .nav-user-btn svg {
    color: var(--text-muted);
    transition: transform 0.2s ease, color 0.2s ease;
    flex-shrink: 0;
  }
  .nav-user-btn:hover svg { color: var(--teal-primary); }
  .nav-user-btn[aria-expanded="true"] svg { transform: rotate(180deg); color: var(--teal-primary); }

  .nav-user-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: linear-gradient(135deg, var(--teal-primary), var(--purple-accent));
    color: #fff !important; font-size: 13px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-family: var(--font-heading);
    box-shadow: 0 2px 10px var(--teal-glow);
  }
  .nav-user-name { font-size: 13px; font-weight: 700; white-space: nowrap; color: var(--text-main); font-family: var(--font-heading); }

  .nav-user-dropdown {
    display: none;
    position: absolute; right: 0; top: calc(100% + 8px);
    background: var(--bg-card);
    border: 1px solid var(--border-card);
    border-radius: 14px; min-width: 220px;
    box-shadow: var(--card-shadow);
    overflow: hidden; z-index: 99999;
  }
  html.dark-theme .nav-user-dropdown { backdrop-filter: blur(20px) saturate(1.3); }
  .nav-user-dropdown.open { display: flex; flex-direction: column; }

  .nav-user-dropdown-header {
    padding: 14px 18px 12px;
    background: var(--surface-2);
    border-bottom: 1px solid var(--border-card);
  }
  .nav-user-dropdown-header div:first-child {
    font-weight: 700; font-size: 13.5px; color: var(--text-main);
    font-family: var(--font-heading); letter-spacing: -0.01em;
  }
  .nav-user-dropdown-header div:last-child {
    font-size: 11.5px; color: var(--text-muted); margin-top: 2px; word-break: break-all;
  }

  .nav-user-dropdown-item {
    display: flex; align-items: center; width: 100%; text-align: left;
    padding: 11px 18px; font-size: 13px; font-weight: 600;
    color: var(--text-main);
    background: transparent; border: none; border-radius: 0;
    cursor: pointer; text-decoration: none; box-shadow: none;
    font-family: var(--font-heading);
    transition: background 0.15s ease, color 0.15s ease;
    box-sizing: border-box;
  }
  .nav-user-dropdown-item:hover { background: var(--teal-dim); color: var(--teal-primary); }

  .nav-user-dropdown-item--danger {
    color: var(--danger) !important;
    border-top: 1px solid var(--border-card);
  }
  .nav-user-dropdown-item--danger:hover {
    color: var(--danger) !important;
    background: rgba(239, 68, 68, 0.08) !important;
  }

  .nav-icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    position: relative;
    width: 36px; height: 36px; min-width: 36px; min-height: 36px;
    border-radius: 50%;
    background: var(--bg-card);
    border: 1px solid var(--border-card);
    color: var(--text-muted);
    transition: all 0.2s ease;
  }
  .nav-icon-btn:hover { border-color: var(--teal-primary); color: var(--teal-primary); }

  /* Theme Toggle Button */
  .theme-toggle-btn {
    width: 36px; height: 36px;
    min-width: 36px; min-height: 36px;
    border-radius: 50%; padding: 0;
    background: var(--bg-card);
    border: 1px solid var(--border-card);
    color: var(--text-main); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s ease; outline: none;
  }
  .theme-toggle-btn:hover {
    border-color: var(--teal-primary);
    color: var(--teal-primary);
    transform: scale(1.05);
  }
  .theme-toggle-btn .sun-icon { display: none; }
  .theme-toggle-btn .moon-icon { display: block; }
  html.dark-theme .theme-toggle-btn .moon-icon { display: none; }
  html.dark-theme .theme-toggle-btn .sun-icon { display: block; }

  /* Page Header */
  header.page-header {
    position: relative; z-index: 10;
    max-width: 1200px; margin: 0 auto;
    padding: 32px 32px 16px;
  }
  h1 {
    font-family: var(--font-heading); font-size: 26px; font-weight: 800;
    color: var(--text-main); letter-spacing: -0.02em; margin-bottom: 6px;
  }
  .subtitle {
    color: var(--text-muted); font-size: 14px; line-height: 1.5;
  }

  /* Nav Pill Bar */
  .admin-nav {
    display: inline-flex; gap: 6px; margin-top: 18px;
    background: var(--surface-1);
    border: 1px solid var(--border-card);
    padding: 5px; border-radius: 9999px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: var(--card-shadow);
  }
  html.dark-theme .admin-nav {
    background: rgba(14, 27, 46, 0.85);
  }
  .admin-nav a {
    color: var(--text-muted); text-decoration: none;
    padding: 8px 18px; border-radius: 9999px;
    font-size: 13px; font-family: var(--font-heading); font-weight: 600;
    transition: all 0.25s ease;
  }
  .admin-nav a:hover {
    color: var(--text-main);
    background: var(--teal-dim);
  }
  .admin-nav a.active {
    background: var(--teal-dim);
    color: var(--teal-primary);
    border: 1px solid rgba(25, 198, 173, 0.35);
    box-shadow: 0 0 14px var(--teal-glow);
  }

  /* Main Layout */
  main {
    position: relative; z-index: 10;
    max-width: 1200px; margin: 0 auto;
    padding: 16px 32px 80px;
  }
  @media (max-width: 850px) { main { padding: 16px 20px 60px; } }

  /* Banners */
  .banner {
    background: var(--warn-dim);
    border: 1px solid var(--warn-border);
    color: #B45309;
    padding: 12px 18px; border-radius: 12px;
    margin-bottom: 24px; font-size: 13px;
    backdrop-filter: blur(10px);
    display: flex; align-items: center; gap: 10px;
  }
  html.dark-theme .banner {
    color: #FDE68A;
  }
  .banner code {
    background: rgba(245, 158, 11, 0.15);
    color: inherit; padding: 2px 6px; border-radius: 4px;
    font-family: monospace;
  }

  section { margin-bottom: 36px; }
  h2 {
    font-family: var(--font-heading); font-size: 17px; font-weight: 700;
    color: var(--text-main); letter-spacing: -0.01em;
    padding-bottom: 10px; margin-bottom: 14px;
    border-bottom: 1px solid var(--border-card);
  }
  h3.sub-heading {
    font-family: var(--font-heading); font-size: 14px; font-weight: 700;
    color: var(--teal-primary); margin: 22px 0 10px;
    letter-spacing: 0.01em;
  }

  /* Tables */
  table {
    width: 100%; border-collapse: collapse; font-size: 13.5px;
    background: var(--bg-card);
    border: 1px solid var(--border-card);
    border-radius: 14px; overflow: hidden;
    box-shadow: var(--card-shadow);
    margin-top: 12px;
  }
  html.dark-theme table {
    background: rgba(10, 21, 37, 0.82);
    backdrop-filter: blur(20px);
  }
  th, td {
    padding: 12px 16px; text-align: left;
    border-bottom: 1px solid var(--border-card);
  }
  th {
    background: var(--surface-2);
    color: var(--text-muted); font-family: var(--font-heading);
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  tbody tr:hover {
    background: var(--surface-2);
  }
  td.metric-label {
    color: var(--text-main); font-weight: 600;
  }
  .muted { color: var(--text-muted); font-size: 13px; margin: 6px 0 12px; line-height: 1.5; }
  .error { color: var(--danger); }
  .meta { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; }

  /* Item 8 — static-vs-live badge */
  .static-badge {
    display: inline-flex; align-items: center;
    padding: 4px 12px; border-radius: 9999px;
    background: var(--surface-2); border: 1px solid var(--border-card);
    color: var(--text-muted); font-size: 11.5px; font-weight: 700;
    font-family: var(--font-heading); letter-spacing: 0.02em;
  }
  .safety-summary-sample { cursor: help; }

  /* Plain List (Weaknesses) */
  ul.plain-list {
    background: var(--bg-card);
    border: 1px solid var(--border-card);
    border-radius: 14px; padding: 16px 24px;
    box-shadow: var(--card-shadow);
    list-style-position: inside;
  }
  html.dark-theme ul.plain-list {
    background: rgba(10, 21, 37, 0.82);
    backdrop-filter: blur(20px);
  }
  ul.plain-list li {
    font-size: 13.5px; line-height: 1.8; color: var(--text-muted);
    border-bottom: 1px solid var(--border-card);
    padding: 4px 0;
  }
  ul.plain-list li:last-child { border-bottom: none; }

  /* Calibration Progress Bars */
  ul.bar-list {
    list-style: none; padding: 0; margin: 12px 0 0;
    display: flex; flex-direction: column; gap: 14px;
    background: var(--bg-card);
    border: 1px solid var(--border-card);
    border-radius: 14px; padding: 20px 24px;
    box-shadow: var(--card-shadow);
  }
  html.dark-theme ul.bar-list {
    background: rgba(10, 21, 37, 0.82);
    backdrop-filter: blur(20px);
  }
  ul.bar-list li { margin-bottom: 0; }
  .bar-label {
    font-family: var(--font-heading); font-size: 13px; font-weight: 600;
    color: var(--text-main); display: block; margin-bottom: 6px;
  }
  .bar-track {
    background: var(--surface-2);
    border: 1px solid var(--border-card);
    border-radius: 9999px; height: 12px; overflow: hidden;
    padding: 2px;
  }
  .bar-fill {
    height: 100%; border-radius: 9999px;
    transition: width 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .bar-fill.bar-well-calibrated {
    background: linear-gradient(90deg, #10B981, #19C6AD);
    box-shadow: 0 0 10px rgba(25, 198, 173, 0.45);
  }
  .bar-fill.bar-overconfident {
    background: linear-gradient(90deg, #F59E0B, #FB923C);
    box-shadow: 0 0 10px rgba(245, 158, 11, 0.45);
  }
  .bar-fill.bar-underconfident {
    background: linear-gradient(90deg, #4C8FF5, #8174E8);
    box-shadow: 0 0 10px rgba(76, 143, 245, 0.45);
  }

  /* ---- Redesign: hero stats, takeaways, question-grouped sections ---- */
  .section-block { margin-bottom: 48px; }
  .section-block h2 { margin-bottom: 6px; border-bottom: none; padding-bottom: 0; }
  .section-rule { border: none; border-top: 1px solid var(--border-card); margin: 0 0 18px; }

  .lead-takeaway {
    font-family: var(--font-body); font-size: 16px; font-weight: 700;
    color: var(--text-main); line-height: 1.55; max-width: 68ch;
    margin-bottom: 26px;
  }
  .takeaway {
    font-family: var(--font-body); font-size: 15px; font-weight: 600;
    color: var(--text-main); line-height: 1.55; max-width: 68ch;
    margin-bottom: 20px;
  }

  .hero-row { display: flex; align-items: flex-end; gap: 32px; flex-wrap: wrap; margin-bottom: 8px; }
  .hero-stat {
    font-family: var(--font-heading); font-weight: 800; font-size: 64px;
    line-height: 1; color: var(--text-main); letter-spacing: -0.02em;
    white-space: nowrap;
  }
  .hero-stat.hero-teal { color: var(--teal-primary); text-shadow: 0 0 30px var(--teal-glow); }
  .hero-stat-suffix { font-size: 26px; font-weight: 700; margin-left: 3px; color: var(--text-dim); }
  .hero-caption { display: flex; flex-direction: column; gap: 4px; }
  .hero-label {
    font-family: var(--font-heading); font-size: 12.5px; font-weight: 700;
    color: var(--text-muted); letter-spacing: 0.01em;
  }

  .section-sub-stats { display: flex; gap: 28px; flex-wrap: wrap; margin: 18px 0 4px; }
  .sub-stat { display: flex; flex-direction: column; gap: 3px; }
  .sub-stat-value { font-family: var(--font-heading); font-size: 21px; font-weight: 700; color: var(--text-dim); }
  .sub-stat-label { font-size: 11.5px; color: var(--text-muted); }
  .sub-stat-median { font-size: 11px; color: var(--text-dim); font-weight: 500; margin-left: 4px; }

  /* Calibration bars — the well-calibrated bar gets visual dominance
     (taller track, bolder label) since it's the section's headline
     figure; over/under stay in the same list but visually quieter. */
  ul.bar-list li.bar-dominant .bar-label { font-size: 15px; font-weight: 800; color: var(--text-main); }
  ul.bar-list li.bar-dominant .bar-track { height: 18px; }
  ul.bar-list li:not(.bar-dominant) .bar-track { height: 9px; }
  ul.bar-list li:not(.bar-dominant) .bar-label { font-size: 12px; font-weight: 600; color: var(--text-muted); }

  /* Weakness categories — horizontal bar-list, same visual language as
     calibration, sorted by count (already is), most-common visually
     dominant. Neutral blue-purple, not judgmental amber/red — this is
     "what's common," not "what's broken." */
  .bar-fill.bar-weakness-top { background: linear-gradient(90deg, #19C6AD, #4C8FF5); box-shadow: 0 0 10px var(--teal-glow); }
  .bar-fill.bar-weakness { background: linear-gradient(90deg, #4C8FF5, #8174E8); opacity: 0.75; }
</style>
</head>
<body>
<!-- Ambient background overlays -->
<div class="bg-grid" aria-hidden="true"></div>
<div class="bg-glow-left" aria-hidden="true"></div>
<div class="bg-glow-right" aria-hidden="true"></div>

<!-- Brand Topbar -->
<nav class="admin-topbar">
  <div class="topbar-brand">
    <a href="index.html" class="brand-logo-link">
      <svg class="logo-symbol" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="pi-ring" x1="0" y1="0" x2="28" y2="28" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#19C6AD"/><stop offset="100%" stop-color="#8174E8"/></linearGradient>
          <linearGradient id="pi-ft" x1="13" y1="14" x2="19" y2="8" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#19C6AD"/><stop offset="100%" stop-color="#4C8FF5"/></linearGradient>
          <linearGradient id="pi-fb" x1="13" y1="14" x2="19" y2="20" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#19C6AD"/><stop offset="100%" stop-color="#8174E8"/></linearGradient>
