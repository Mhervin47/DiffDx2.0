services:
  - type: web
    name: diffdx
    runtime: python
    # Omitting plan here defaults to the paid Starter tier, not free —
    # this was missed when the database/Redis plans below were set
    # explicitly. Free web services spin down after ~15 min idle and take
    # ~30-60s to cold-start the next request — fine for a demo/low-traffic
    # deploy, not for anything that needs to always respond instantly.
    plan: free
    rootDir: loop1
    # The admin-seed step only fires when ADMIN_SEED_EMAIL is actually set
    # in the environment (it's a no-op shell conditional otherwise) --
    # scripts/seed_admin.py itself is deliberately not auto-run on every
    # boot (see its own docstring, Decision Gate D3 Option A: creating an
    # admin account should be a deliberate, explicit step, not automatic).
    # Originally that meant running it once by hand from a shell on the
    # deployed instance -- Render's free web-service plan doesn't offer
    # Shell access, so this build-time conditional is the free-tier
    # equivalent: set ADMIN_SEED_EMAIL/ADMIN_SEED_PASSWORD in the
    # Environment tab, save (which triggers a redeploy), the account gets
    # created on that one build, and the two vars can be removed again
    # afterward -- the script is idempotent either way.
    buildCommand: pip install -r requirements-web.txt && pip install -e . --no-deps && PYTHONPATH=src alembic upgrade head && PYTHONPATH=src python scripts/seed_doctors.py && (if [ -n "$ADMIN_SEED_EMAIL" ]; then PYTHONPATH=src python scripts/seed_admin.py; fi)
    startCommand: PYTHONPATH=src uvicorn web.api:app --host 0.0.0.0 --port $PORT
    envVars:
      # Auto-wired to the Postgres instance declared below — Render fills
      # this in itself at deploy time (its internal connection string,
      # already including sslmode), so it's never typed/pasted anywhere.
      - key: DATABASE_URL
        fromDatabase:
          name: diffdx-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.2
      # Task 5: the app refuses to start with ENVIRONMENT=production unless
      # SECRET_KEY and CORS_ALLOWED_ORIGINS are also set — see
      # config.py's _require_production_settings. Declared here (rather
      # than left for someone to discover via a boot-time crash) so a
      # fresh Render deploy from this blueprint prompts for them upfront.
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Used by the live app (see loop1/.env.example) — declared so they're
      # prompted for in the dashboard instead of silently defaulting/
      # disabling the feature that depends on them.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      # Auto-wired to the Key Value instance declared below, same as
      # DATABASE_URL above.
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: diffdx-redis
          property: connectionString
      - key: RESEND_FROM
        sync: false
      # Left unset by default (that's what keeps the buildCommand's admin-
      # seed step a no-op). Fill these in via the Environment tab and save
      # to actually create the admin account on the next build.
      - key: ADMIN_SEED_EMAIL
        sync: false
      - key: ADMIN_SEED_PASSWORD
        sync: false
      - key: ADMIN_SEED_NAME
        sync: false
  # Optional — only used so session_store.py can share diagnostic-session
  # state across restarts/multiple instances (see src/diffdx/session_store.py);
  # a single instance works fine without it, just re-fetch a session mid-
  # conversation is lost if that instance restarts. Free plan is 25MB,
  # single node, no persistence guarantee across host maintenance — fine
  # for session state (small, short-lived), not a fit for anything that
  # needs to survive a Redis restart. ipAllowList empty = only reachable
  # from other services in this account's private network, not the public
  # internet.
  - type: keyvalue
    name: diffdx-redis
    plan: free
    ipAllowList: []

databases:
  # Render's free Postgres tier is deliberately time-limited (expires ~30
  # days after creation, then the instance is deleted) — fine for an
  # initial deploy/demo, but plan to upgrade to a paid plan before that
  # window closes for anything meant to stay up. plan defaults to "free"
  # if omitted; set explicitly here so that choice is visible, not implicit.
  - name: diffdx-db
    plan: free
    databaseName: diffdx
    user: diffdx
