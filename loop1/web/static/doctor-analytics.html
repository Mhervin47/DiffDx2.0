<!DOCTYPE html>
<html lang="en" class="dark-theme">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DiffDx — Practice Analytics & Telemetry</title>
  <script>
    if (localStorage.getItem('theme') === 'light') {
      document.documentElement.classList.remove('dark-theme');
    } else {
      document.documentElement.classList.add('dark-theme');
    }
  </script>
  <link rel="stylesheet" href="/reloader.css">
  <script src="/reloader.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Manrope:wght@500;600;700;800&family=Sora:wght@400;500;600;700;800;900&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script src="/auth.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-dark: #F1F5F9;
      --bg-card: #FFFFFF;
      --border-card: #CBD5E1;
      --border: #CBD5E1;
      --border-subtle: #E2E8F0;
      --teal-primary: #0D9488;
      --teal-glow: rgba(13, 148, 136, 0.16);
      --blue-secondary: #2563EB;
      --purple-accent: #6D28D9;
      --amber-accent: #B45309;
      --danger: #DC2626;
      --text: #0F172A;
      --text-main: #0F172A;
      --text-muted: #475569;
      --text-dim: #334155;
      --nav-bg: rgba(255, 255, 255, 0.96);
      --btn-nav-bg: #FFFFFF;
      --btn-nav-border: #CBD5E1;
      --btn-nav-text: #0F172A;
      --card-shadow: 0 4px 24px rgba(15, 23, 42, 0.06);
      --surface-1: #FFFFFF;
      --surface-2: #F8FAFC;
      --surface-3: #F1F5F9;
      --surface-4: #E2E8F0;
      --primary: #0D9488;
      --primary-light: #14B8A6;
      --primary-dark: #0F766E;
      --primary-dim: rgba(13, 148, 136, 0.12);
      --font-heading: 'Sora', sans-serif;
      --font-body: 'Noto Sans', sans-serif;
    }

    html.dark-theme {
      --bg-dark: #050D18;
      --bg-card: #0A1525;
      --border-card: rgba(150, 180, 210, 0.10);
      --border: rgba(150, 180, 210, 0.12);
      --border-subtle: rgba(150, 180, 210, 0.06);
      --teal-primary: #19C6AD;
      --teal-glow: rgba(25, 198, 173, 0.22);
      --blue-secondary: #4C8FF5;
      --purple-accent: #8174E8;
      --amber-accent: #F59E0B;
      --danger: #EF4444;
      --text: #EAF2FA;
      --text-main: #EAF2FA;
      --text-muted: #8FA2B9;
      --text-dim: #94A3B8;
      --nav-bg: rgba(5, 13, 24, 0.88);
      --btn-nav-bg: rgba(255, 255, 255, 0.04);
      --btn-nav-border: rgba(150, 180, 210, 0.10);
      --btn-nav-text: #EAF2FA;
      --card-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.04) inset;
      --surface-1: #0A1525;
      --surface-2: #0E1B2E;
      --surface-3: #13243C;
      --surface-4: #192F4D;
      --primary: #19C6AD;
      --primary-light: #34D399;
      --primary-dark: #059669;
      --primary-dim: rgba(25, 198, 173, 0.15);
    }

    body {
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* Ambient Background Effects */
    .bg-grid {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: radial-gradient(rgba(143, 162, 185, 0.07) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: radial-gradient(ellipse 85% 65% at 50% 25%, black 40%, transparent 95%);
    }

    .bg-glow-left {
      position: fixed; top: -120px; left: -100px; width: 640px; height: 640px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--teal-glow) 0%, transparent 70%);
      filter: blur(100px); pointer-events: none; z-index: 0;
      animation: floatGlowLeft 22s ease-in-out infinite alternate;
    }

    .bg-glow-right {
      position: fixed; top: 180px; right: -120px; width: 680px; height: 680px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(76, 143, 245, 0.09) 0%, transparent 70%);
      filter: blur(110px); pointer-events: none; z-index: 0;
      animation: floatGlowRight 24s ease-in-out infinite alternate;
    }

    @keyframes floatGlowLeft {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(35px, 25px) scale(1.06); }
    }
    @keyframes floatGlowRight {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-30px, -35px) scale(1.04); }
    }

    /* Header Nav (EXACT SAME AS OVERVIEW) */
    .nav {
      position: sticky !important; top: 0 !important; left: 0 !important; right: 0 !important; transform: none !important;
      width: 100% !important; max-width: 100% !important; border-radius: 0 !important;
      height: 72px !important; min-height: 72px !important; z-index: 100 !important;
      padding: 0 38px !important;
      display: flex !important; align-items: center !important; justify-content: space-between !important;
      background: var(--topbar-bg, rgba(255, 255, 255, 0.88)) !important;
      backdrop-filter: blur(20px) !important;
      -webkit-backdrop-filter: blur(20px) !important;
      border: none !important;
      border-bottom: 1px solid var(--topbar-border, rgba(215, 228, 233, 0.75)) !important;
      box-shadow: none !important;
      transition: background 0.3s ease, border-color 0.3s ease;
      box-sizing: border-box !important;
    }
    html.dark-theme .nav {
      background: rgba(9, 13, 22, 0.88) !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
    }

    .nav-left, .brand-section {
      display: flex; align-items: center; gap: 28px;
    }

    .brand, .nav-brand {
      display: flex; align-items: center; gap: 11px;
      text-decoration: none;
      transition: transform 0.2s ease;
    }
    .brand:hover, .nav-brand:hover {
      transform: translateY(-0.5px);
    }
    .brand-icon, .nav-brand svg {
      filter: drop-shadow(0 0 8px rgba(15, 168, 141, 0.35));
      transition: transform 0.2s ease, filter 0.2s ease;
      width: 32px !important; height: 32px !important; flex-shrink: 0 !important;
    }
    .brand:hover .brand-icon, .nav-brand:hover svg {
      transform: scale(1.05);
      filter: drop-shadow(0 0 12px rgba(15, 168, 141, 0.55));
    }
    .brand-name, .nav-brand-text {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
      font-size: 20px !important;
      font-weight: 800;
      letter-spacing: -0.035em;
      color: var(--text-main);
      line-height: 1;
    }
    .brand-accent, .nav-brand-text span {
      background: linear-gradient(100deg, var(--teal, #0fa88d) 0%, var(--blue, #2879d8) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Doctor Portal Navigation Tabs (Exact 1:1 match with Overview) */
    .doctor-nav-tabs {
      display: flex !important;
      align-items: center !important;
      gap: 6px !important;
      background: #ffffff !important;
      padding: 4px 6px !important;
      border-radius: 999px !important;
      border: 1px solid #dfe9ed !important;
      box-shadow: 0 4px 16px rgba(27, 67, 84, 0.06) !important;
      margin: 0 !important;
    }
    html.dark-theme .doctor-nav-tabs {
      background: rgba(13, 20, 38, 0.45) !important;
      border-color: rgba(255, 255, 255, 0.1) !important;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4) !important;
    }

    .doctor-nav-tab {
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 7px !important;
      padding: 6px 14px !important;
      border-radius: 999px !important;
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
      font-size: 12.5px !important;
      font-weight: 700 !important;
      line-height: 1 !important;
      color: #31445f !important;
      transition: all 0.2s ease !important;
      text-decoration: none !important;
      white-space: nowrap !important;
      box-sizing: border-box !important;
    }
    html.dark-theme .doctor-nav-tab {
      color: #cbd5e1 !important;
    }
    .doctor-nav-tab:hover {
      color: #0fa88d !important;
      background: rgba(15, 168, 141, 0.06) !important;
    }
    html.dark-theme .doctor-nav-tab:hover {
      color: #14b8a6 !important;
      background: rgba(20, 184, 166, 0.12) !important;
    }
    .doctor-nav-tab.active {
      background: linear-gradient(135deg, #0fa88d 0%, #07816e 100%) !important;
      color: #ffffff !important;
      box-shadow: 0 2px 10px rgba(15, 168, 141, 0.3) !important;
    }
    .doctor-nav-tab svg {
      flex-shrink: 0 !important;
      width: 14px !important;
      height: 14px !important;
    }
    @media (max-width: 1100px) {
      .doctor-nav-tabs span { display: none; }
      .doctor-nav-tab { padding: 7px; }
    }
    @media (max-width: 820px) {
      .doctor-nav-tabs { display: none; }
    }

    .nav-right {
      display: flex; align-items: center; gap: 12px; margin-left: auto;
    }

    .nav-refresh-btn {
      width: 38px !important; height: 38px !important;
      min-width: 38px !important; min-height: 38px !important;
      max-width: 38px !important; max-height: 38px !important;
      display: inline-flex !important; align-items: center !important; justify-content: center !important;
      border-radius: 50% !important;
      box-sizing: border-box !important;
      padding: 0 !important;
      background: var(--option-bg, #ffffff);
      border: 1px solid var(--border);
      color: var(--text-soft, var(--text-main));
      cursor: pointer;
      box-shadow: var(--shadow-sm, 0 4px 16px rgba(27, 67, 84, 0.06));
      transition: all .2s ease;
      flex-shrink: 0;
    }
    /* Nav icon SVG size lock */
    .nav-refresh-btn svg,
    #nav-notif-btn svg, #nav-refill-btn svg, .nav-icon-btn svg, #theme-toggle svg {
      display: block !important;
      flex-shrink: 0 !important;
      width: 16px !important;
      height: 16px !important;
    }
    /* Theme toggle: NO display override — sun/moon toggled via display:none */
    .theme-toggle-btn svg {
      flex-shrink: 0 !important;
      width: 16px !important;
      height: 16px !important;
    }
    html.dark-theme .nav-refresh-btn {
      background: rgba(13, 20, 38, 0.45) !important;
      border-color: rgba(255, 255, 255, 0.1) !important;
      color: #cbd5e1 !important;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4) !important;
    }
    .nav-refresh-btn:hover {
      border-color: rgba(15, 168, 141, 0.4);
      color: var(--teal, #0fa88d);
      transform: rotate(45deg);
    }
    .nav-refresh-btn svg { transition: transform .3s ease; }

    /* Theme Toggle */
    .theme-toggle-btn {
      width: 38px !important; height: 38px !important;
      min-width: 38px !important; min-height: 38px !important;
      max-width: 38px !important; max-height: 38px !important;
      display: inline-flex !important; align-items: center !important; justify-content: center !important;
      border-radius: 50% !important;
      box-sizing: border-box !important;
      padding: 0 !important;
      background: var(--option-bg, #ffffff);
      border: 1px solid var(--border);
      color: var(--text-soft, var(--text-dim));
      cursor: pointer;
      box-shadow: var(--shadow-sm, 0 4px 16px rgba(27, 67, 84, 0.06));
      transition: all .2s ease;
      flex-shrink: 0;
    }
    html.dark-theme .theme-toggle-btn {
      background: rgba(13, 20, 38, 0.45) !important;
      border-color: rgba(255, 255, 255, 0.1) !important;
      color: #cbd5e1 !important;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4) !important;
    }
    .theme-toggle-btn:hover {
      border-color: rgba(15, 168, 141, 0.4);
      color: var(--teal, #0fa88d);
      transform: scale(1.06);
    }
    html.dark-theme .sun-icon { display: block !important; }
    html.dark-theme .moon-icon { display: none !important; }
    html:not(.dark-theme) .sun-icon { display: none !important; }
    html:not(.dark-theme) .moon-icon { display: block !important; }

    #nav-refill-btn, #nav-notif-btn, .nav-icon-btn {
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      width: 38px !important;
      height: 38px !important;
      min-width: 38px !important;
      min-height: 38px !important;
      max-width: 38px !important;
      max-height: 38px !important;
      border-radius: 50% !important;
      box-sizing: border-box !important;
      padding: 0 !important;
      background: var(--btn-nav-bg) !important;
      border: 1px solid var(--btn-nav-border) !important;
      color: var(--text-muted) !important;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      transition: all .15s ease !important;
      flex-shrink: 0 !important;
      position: relative !important;
      text-decoration: none !important;
    }
    #nav-refill-btn:hover, #nav-notif-btn:hover, .nav-icon-btn:hover {
      border-color: var(--primary) !important;
      color: var(--primary) !important;
      transform: translateY(-1px);
    }

    /* Page Layout */
    .analytics-page-wrapper {
      max-width: 1240px;
      margin: 0 auto;
      padding: 32px 28px 90px;
      position: relative;
      z-index: 1;
    }

    .analytics-header {
      display: flex; align-items: flex-end; justify-content: space-between;
      margin-bottom: 28px; gap: 20px; flex-wrap: wrap;
    }
    .ah-left { flex: 1; min-width: 280px; }
    .page-title {
      font-family: var(--font-heading);
      font-size: 28px; font-weight: 800; letter-spacing: -.02em;
      color: var(--text-main); margin-bottom: 6px;
    }
    .page-subtitle {
      font-size: 14px; color: var(--text-dim); line-height: 1.55;
    }

    .telemetry-badge {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 14px; border-radius: 9999px;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      box-shadow: var(--card-shadow);
      font-family: var(--font-heading);
      font-size: 12px; font-weight: 700; color: var(--text-main);
    }
    .telemetry-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #10B981;
      box-shadow: 0 0 8px #10B981;
      animation: pulseGreen 2s infinite ease-in-out;
    }
    @keyframes pulseGreen {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* 4-KPI Metric Cards Grid */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 28px;
    }
    @media (max-width: 980px) {
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 540px) {
      .kpi-grid { grid-template-columns: 1fr; }
    }

    .kpi-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 20px;
      padding: 22px 24px;
      position: relative;
      overflow: hidden;
      box-shadow: var(--card-shadow);
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      display: flex; flex-direction: column;
    }
    .kpi-card:hover {
      transform: translateY(-2px);
      border-color: rgba(13, 148, 136, 0.35);
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }
    html.dark-theme .kpi-card:hover {
      border-color: rgba(25, 198, 173, 0.35);
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }

    .kpi-top {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px;
    }
    .kpi-icon-wrap {
      width: 44px; height: 44px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: transform 0.2s ease;
    }
    .kpi-card:hover .kpi-icon-wrap {
      transform: scale(1.06);
    }

    .kpi-tag {
      font-size: 10.5px; font-weight: 700; letter-spacing: .04em;
      text-transform: uppercase; padding: 3px 9px; border-radius: 6px;
      font-family: var(--font-heading);
    }

    .kpi-value {
      font-family: var(--font-heading);
      font-size: 34px; font-weight: 800; line-height: 1.1;
      margin-bottom: 6px; letter-spacing: -.02em;
    }

    .kpi-label {
      font-family: var(--font-heading);
      font-size: 11.5px; font-weight: 700; letter-spacing: .05em;
      text-transform: uppercase; color: var(--text-dim);
      margin-bottom: 4px;
    }

    .kpi-subtext {
      font-size: 12px; color: var(--text-muted); font-weight: 500;
      margin-top: auto; padding-top: 8px; border-top: 1px solid var(--border-subtle);
    }

    /* Analytics Panels */
    .analytics-panel {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 20px;
      padding: 26px 28px;
      margin-bottom: 24px;
      box-shadow: var(--card-shadow);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .analytics-panel:hover {
      border-color: rgba(13, 148, 136, 0.28);
    }
    html.dark-theme .analytics-panel:hover {
      border-color: rgba(25, 198, 173, 0.28);
    }

    .panel-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 24px; gap: 16px; flex-wrap: wrap;
      padding-bottom: 16px; border-bottom: 1px solid var(--border-subtle);
    }
    .ph-title-wrap { flex: 1; min-width: 240px; }
    .panel-title {
      font-family: var(--font-heading);
      font-size: 16px; font-weight: 700; letter-spacing: -.01em;
      color: var(--text-main); margin-bottom: 4px;
      display: flex; align-items: center; gap: 8px;
    }
    .panel-subtitle {
      font-size: 12.5px; color: var(--text-muted); font-weight: 500;
    }

    /* Legend */
    .legend {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .legend-item {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; font-weight: 600; color: var(--text-dim);
      font-family: var(--font-heading);
      padding: 4px 10px; border-radius: 9999px;
      background: var(--surface-2); border: 1px solid var(--border-subtle);
    }
    .legend-dot {
      width: 8px; height: 8px; border-radius: 50%;
    }

    /* Stacked Bar Chart */
    .chart-wrapper {
      width: 100%;
      padding-top: 10px;
    }
    .chart {
      display: flex; align-items: flex-end; gap: 18px;
      height: 220px; width: 100%;
      padding: 0 10px 10px;
      border-bottom: 1.5px solid var(--border-subtle);
      position: relative;
    }
    @media (max-width: 680px) {
      .chart { gap: 8px; padding: 0 4px 10px; height: 180px; }
    }

    .chart-col {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      height: 100%; justify-content: flex-end;
      position: relative;
    }

    .bar-stack {
      width: 100%; max-width: 52px; display: flex; flex-direction: column-reverse;
      border-radius: 8px 8px 0 0; overflow: hidden; min-height: 4px;
      transition: height .4s cubic-bezier(0.16, 1, 0.3, 1), transform .2s ease;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .bar-stack:hover {
      transform: scaleY(1.03) translateY(-2px);
      filter: brightness(1.08);
    }

    .bar-seg {
      width: 100%; transition: height .3s ease;
    }
    .bar-booked {
      background: linear-gradient(180deg, var(--teal-primary), var(--primary-dark));
    }
    .bar-noshow {
      background: linear-gradient(180deg, #EF4444, #DC2626);
    }
    .bar-open {
      background: var(--surface-4);
    }
    html.dark-theme .bar-open {
      background: #192F4D;
    }

    .chart-label {
      font-family: var(--font-heading);
      font-size: 11px; color: var(--text-dim); margin-top: 12px;
      font-weight: 700; letter-spacing: .02em;
    }
    @media (max-width: 680px) {
      .chart-label { font-size: 9.5px; }
    }

    /* Attendance Telemetry Table */
    .table-responsive {
      width: 100%; overflow-x: auto;
    }
    table.ns-table {
      width: 100%; border-collapse: separate; border-spacing: 0;
    }
    .ns-table th {
      text-align: left; font-family: var(--font-heading);
      font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
      color: var(--text-dim); padding: 12px 16px;
      background: var(--surface-2); border-top: 1px solid var(--border-subtle);
      border-bottom: 1px solid var(--border);
    }
    .ns-table th:first-child { border-radius: 10px 0 0 10px; }
    .ns-table th:last-child { border-radius: 0 10px 10px 0; text-align: right; }

    .ns-table td {
      font-size: 13.5px; color: var(--text-main); padding: 14px 16px;
      border-bottom: 1px solid var(--border-subtle);
      font-weight: 500;
    }
    .ns-table td:last-child { text-align: right; }

    .ns-table tbody tr {
      transition: background .15s ease;
    }
    .ns-table tbody tr:hover td {
      background: var(--surface-2);
    }

    .patient-cell {
      display: flex; align-items: center; gap: 10px; font-weight: 700;
    }
    .patient-avatar-mini {
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--primary-dim); border: 1px solid rgba(13, 148, 136, 0.25);
      color: var(--primary); font-size: 12px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-heading); flex-shrink: 0;
    }

    .ns-count {
      display: inline-flex; align-items: center; gap: 5px;
      font-weight: 700; background: rgba(239, 68, 68, 0.12);
      color: #DC2626; border: 1px solid rgba(239, 68, 68, 0.28);
      border-radius: 9999px; padding: 3px 10px; font-size: 12px;
      font-family: var(--font-heading);
    }
    html.dark-theme .ns-count {
      color: #F87171;
    }

    .reliability-pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 3px 10px; border-radius: 9999px;
      font-size: 12px; font-weight: 700; font-family: var(--font-heading);
    }
    .rel-high { background: rgba(16, 185, 129, 0.12); color: #047857; border: 1px solid rgba(16, 185, 129, 0.28); }
    .rel-med { background: rgba(245, 158, 11, 0.12); color: #B45309; border: 1px solid rgba(245, 158, 11, 0.28); }
    .rel-low { background: rgba(239, 68, 68, 0.12); color: #DC2626; border: 1px solid rgba(239, 68, 68, 0.28); }
    html.dark-theme .rel-high { color: #34D399; }
    html.dark-theme .rel-med { color: #F59E0B; }
    html.dark-theme .rel-low { color: #F87171; }

    .empty-row-card {
      text-align: center; color: var(--text-dim); padding: 36px 20px;
      font-size: 13.5px; font-weight: 600;
    }
    .empty-icon-wrap {
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.28);
      color: #10B981; display: inline-flex; align-items: center; justify-content: center;
      margin-bottom: 12px;
    }

    /* Thinking / Loading Row */
    .thinking-row {
      display: flex; align-items: center; gap: 14px;
      padding: 36px 28px; font-size: 14px; color: var(--text-dim);
      font-family: var(--font-heading); font-weight: 600;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 20px; box-shadow: var(--card-shadow);
      justify-content: center;
    }
    .spinner {
      width: 24px; height: 24px; border-radius: 50%;
      border: 2.5px solid var(--border-subtle);
      border-top-color: var(--primary);
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg {
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: 16px; padding: 18px 22px;
      color: #DC2626; font-weight: 600; font-size: 14px;
    }
    html.dark-theme .error-msg { color: #F87171; }
  </style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow-left"></div>
<div class="bg-glow-right"></div>

<!-- Top Sticky Navigation Bar -->
<nav class="nav">
  <div class="brand-section">
    <a href="/doctor-overview.html" class="brand" title="DiffDx Overview">
      <svg class="brand-icon" width="32" height="32" viewBox="0 0 28 28" fill="none">
        <defs>
          <linearGradient id="doc-ring-an" x1="0" y1="0" x2="28" y2="28" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#0fa88d" />
            <stop offset="100%" stop-color="#2879d8" />
          </linearGradient>
          <linearGradient id="doc-ft-an" x1="13" y1="14" x2="19" y2="8" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#0fa88d" />
            <stop offset="100%" stop-color="#14b8a6" />
          </linearGradient>
          <linearGradient id="doc-fb-an" x1="13" y1="14" x2="19" y2="20" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#0fa88d" />
            <stop offset="100%" stop-color="#2879d8" />
          </linearGradient>
        </defs>
        <circle cx="14" cy="14" r="12.5" stroke="url(#doc-ring-an)" stroke-width="1.3" fill="rgba(15,168,141,.08)" />
        <line x1="6" y1="14" x2="13" y2="14" stroke="#0fa88d" stroke-width="2" stroke-linecap="round" />
        <path d="M13 14 L19 8.5" stroke="url(#doc-ft-an)" stroke-width="2" stroke-linecap="round" />
        <path d="M13 14 L19 19.5" stroke="url(#doc-fb-an)" stroke-width="2" stroke-linecap="round" />
        <circle cx="20" cy="8.5" r="2" fill="#14b8a6" />
        <circle cx="20" cy="19.5" r="2" fill="#2879d8" />
      </svg>
      <span class="brand-name">Diff<span class="brand-accent">/Dx</span></span>
    </a>

    <!-- Doctor Navigation Tabs -->
    <div class="doctor-nav-tabs">
      <a href="/doctor-overview.html" class="doctor-nav-tab">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/>
        </svg>
        <span>Overview</span>
      </a>
      <a href="/doctor-portal.html" class="doctor-nav-tab">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <span>Patient Queue</span>
      </a>
      <a href="/messages.html" class="doctor-nav-tab">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <span>Messages</span>
      </a>
      <a href="/doctor-analytics.html" class="doctor-nav-tab active">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
        </svg>
        <span>Analytics</span>
      </a>
      <a href="/doctor-profile.html" class="doctor-nav-tab">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="12" cy="7" r="4"/><path d="M6 21v-2a6 6 0 0 1 12 0v2"/>
        </svg>
        <span>Profile</span>
      </a>
    </div>
  </div>

  <div class="nav-right">
    <button class="nav-refresh-btn" onclick="load()" title="Sync Analytics" aria-label="Sync Analytics">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
    </button>
    <button id="theme-toggle" class="theme-toggle-btn" onclick="toggleTheme()" aria-label="Toggle theme" title="Toggle theme">
      <svg class="sun-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <svg class="moon-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
    <div id="nav-auth" style="display:flex;align-items:center;gap:6px;"></div>
  </div>
</nav>

<!-- Main Analytics Content -->
<div class="analytics-page-wrapper">
  <div class="analytics-header">
    <div class="ah-left">
      <h1 class="page-title">Practice Analytics</h1>
      <p class="page-subtitle">Track consultation volume, booking capacity, slot utilization trends, and no-show attendance telemetry.</p>
    </div>
    <div class="ah-right">
      <div class="telemetry-badge">
        <span class="telemetry-dot"></span>
        <span>Live Telemetry</span>
      </div>
    </div>
  </div>

  <div id="analytics-container">
    <div class="thinking-row"><div class="spinner"></div> Loading practice analytics…</div>
  </div>
</div>

<script>
const user = getAuthUser();
if (!user) {
  window.location.replace('/login.html?next=/doctor-analytics.html');
} else if (user.role !== 'doctor') {
  window.location.replace('/');
}

function toggleTheme() {
  const isDark = document.documentElement.classList.toggle('dark-theme');
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtDate(iso) {
  if (!iso) return '—';
  try {
    return new Date(iso).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
  } catch {
    return iso;
  }
}

const ICONS = {
  appts: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`,
  util: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="18" y="3" width="4" height="18" rx="1"/><rect x="10" y="8" width="4" height="13" rx="1"/><rect x="2" y="13" width="4" height="8" rx="1"/></svg>`,
  noshow: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`,
  patients: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`,
};

function kpiCard(icon, color, bgGlow, value, label, subtext, tagText) {
  return `
    <div class="kpi-card">
      <div class="kpi-top">
        <div class="kpi-icon-wrap" style="background:${bgGlow}; color:${color};">
          ${icon}
        </div>
        ${tagText ? `<span class="kpi-tag" style="background:${bgGlow}; color:${color};">${tagText}</span>` : ''}
      </div>
      <div class="kpi-value" style="color:${color};">${value}</div>
      <div class="kpi-label">${label}</div>
      <div class="kpi-subtext">${subtext}</div>
    </div>`;
}

function render(data) {
  const k = data.kpis || {};
  const weekly = data.weekly || [];
  const maxTotal = Math.max(1, ...weekly.map(w => (w.booked || 0) + (w.noshow || 0) + (w.open || 0)));

  const chart = weekly.map(w => {
    const total = (w.booked || 0) + (w.noshow || 0) + (w.open || 0);
    const h = Math.round((total / maxTotal) * 100);
    const seg = (cls, n) => n > 0 ? `<div class="bar-seg ${cls}" style="height:${(n/total)*100}%"></div>` : '';
    const labelClean = String(w.label || '').replace(/^Wk\s*/i, 'Wk ');
    return `
      <div class="chart-col">
        <div class="bar-stack" style="height:${Math.max(6, h)}%" title="${escHtml(labelClean)}: ${w.booked} booked, ${w.noshow} no-show, ${w.open} open (${total} total)">
          ${total > 0 ? seg('bar-booked', w.booked) + seg('bar-noshow', w.noshow) + seg('bar-open', w.open) : '<div class="bar-seg bar-open" style="height:100%"></div>'}
        </div>
        <div class="chart-label">${escHtml(labelClean)}</div>
      </div>`;
  }).join('');

  const ns = data.noshows || [];
  const nsRows = ns.length ? ns.map(n => {
    const totalBooked = n.total || 1;
    const missed = n.count || 0;
    const reliability = Math.max(0, Math.min(100, Math.round(((totalBooked - missed) / totalBooked) * 100)));
    let relCls = 'rel-high';
    if (reliability < 60) relCls = 'rel-low';
    else if (reliability < 85) relCls = 'rel-med';

    const initials = escHtml((n.patient_name || 'Patient').split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase());

    return `
      <tr>
        <td>
          <div class="patient-cell">
            <span class="patient-avatar-mini">${initials}</span>
            <span>${escHtml(n.patient_name)}</span>
          </div>
        </td>
        <td><span class="ns-count">${missed} missed</span></td>
        <td>${fmtDate(n.last_date)}</td>
        <td>${totalBooked}</td>
        <td><span class="reliability-pill ${relCls}">${reliability}% reliability</span></td>
      </tr>`;
  }).join('')
  : `
    <tr>
      <td colspan="5">
        <div class="empty-row-card">
          <div class="empty-icon-wrap">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <div>No no-shows recorded. Excellent patient attendance across all slots!</div>
        </div>
      </td>
    </tr>`;

  const totalAppts = k.total_appts ?? 0;
  const utilPct = k.utilization_pct ?? 0;
  const noshowRate = k.noshow_rate ?? 0;
  const totalPatients = k.total_patients ?? 0;

  document.getElementById('analytics-container').innerHTML = `
    <!-- Executive 4-KPI Metric Cards -->
    <div class="kpi-grid">
      ${kpiCard(
        ICONS.appts,
        'var(--blue-secondary)',
        'rgba(37, 99, 235, 0.12)',
        totalAppts,
        'Total Appointments',
        'Total booked patient consultations',
        'Volume'
      )}
      ${kpiCard(
        ICONS.util,
        'var(--primary)',
        'rgba(13, 148, 136, 0.12)',
        utilPct + '%',
        'Slot Utilization',
        'Optimal schedule efficiency target > 75%',
        'Efficiency'
      )}
      ${kpiCard(
        ICONS.noshow,
        noshowRate > 15 ? 'var(--danger)' : '#F59E0B',
        noshowRate > 15 ? 'rgba(239, 68, 68, 0.12)' : 'rgba(245, 158, 11, 0.12)',
        noshowRate + '%',
        'No-Show Rate',
        noshowRate <= 8 ? 'Healthy industry average (&le; 8%)' : 'Attention: higher than target',
        'Attendance'
      )}
      ${kpiCard(
        ICONS.patients,
        'var(--purple-accent)',
        'rgba(109, 40, 217, 0.12)',
        totalPatients,
        'Total Patients',
        'Unique individuals consulted',
        'Roster'
      )}
    </div>

    <!-- Panel 1: Slot Utilization Breakdown -->
    <div class="analytics-panel">
      <div class="panel-header">
        <div class="ph-title-wrap">
          <div class="panel-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2.2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
            <span>Slot Utilization — Last 8 Weeks</span>
          </div>
          <div class="panel-subtitle">Weekly comparison of booked patient consultations, missed bookings, and open capacity</div>
        </div>
        <div class="legend">
          <div class="legend-item"><span class="legend-dot" style="background:var(--primary);"></span>Booked</div>
          <div class="legend-item"><span class="legend-dot" style="background:var(--danger);"></span>No-Show</div>
          <div class="legend-item"><span class="legend-dot" style="background:var(--surface-4);"></span>Open Capacity</div>
        </div>
      </div>
      <div class="chart-wrapper">
        <div class="chart">${chart || '<div class="empty-row-card">No weekly data recorded yet.</div>'}</div>
      </div>
    </div>

    <!-- Panel 2: No-Show Attendance Telemetry -->
    <div class="analytics-panel">
      <div class="panel-header">
        <div class="ph-title-wrap">
          <div class="panel-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#EF4444" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span>No-Show Attendance Records</span>
          </div>
          <div class="panel-subtitle">Patients with missed consultation history and historic attendance reliability</div>
        </div>
      </div>
      <div class="table-responsive">
        <table class="ns-table">
          <thead>
            <tr>
              <th>Patient</th>
              <th>Missed Consultations</th>
              <th>Last Missed Date</th>
              <th>Total Booked</th>
              <th>Reliability Score</th>
            </tr>
          </thead>
          <tbody>${nsRows}</tbody>
        </table>
      </div>
    </div>`;
}

async function load() {
  const c = document.getElementById('analytics-container');
  try {
    const res = await fetch('/api/doctor/analytics', { headers: { ...authHeaders() } });
    if (!res.ok) {
      if (res.status === 401) {
        clearAuth();
        window.location.replace('/login.html');
        return;
      }
      throw new Error(await res.text());
    }
    const data = await res.json();
    render(data);
  } catch (e) {
    c.innerHTML = `<div class="error-msg">Error loading analytics: ${escHtml(e.message)}</div>`;
  }
}

load();
</script>
</body>
</html>
