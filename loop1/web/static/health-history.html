<!DOCTYPE html>
<html lang="en" class="dark-theme">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DiffDx — Health & Consultation History</title>
  <script>
    if (localStorage.getItem('theme') === 'light') {
      document.documentElement.classList.remove('dark-theme');
    } else {
      document.documentElement.classList.add('dark-theme');
    }
  </script>
  <link rel="stylesheet" href="/reloader.css">
  <script src="/reloader.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Manrope:wght@500;600;700;800&family=Sora:wght@400;500;600;700;800;900&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script src="/auth.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-dark: #F1F5F9;
      --bg-card: #FFFFFF;
      --border-card: #CBD5E1;
      --border: #CBD5E1;
      --border-subtle: #E2E8F0;
      --teal-primary: #0D9488;
      --teal-glow: rgba(13, 148, 136, 0.16);
      --blue-secondary: #2563EB;
      --purple-accent: #6D28D9;
      --amber-accent: #B45309;
      --text: #0F172A;
      --text-main: #0F172A;
      --text-muted: #475569;
      --text-dim: #334155;
      --topbar-bg: rgba(255, 255, 255, 0.96);
      --card-shadow: 0 4px 24px rgba(15, 23, 42, 0.06);
      --surface-1: #FFFFFF;
      --surface-2: #F8FAFC;
      --surface-3: #F1F5F9;
      --surface-4: #E2E8F0;
      --primary: #0D9488;
      --primary-light: #14B8A6;
      --primary-dim: rgba(13, 148, 136, 0.12);
      --font-heading: 'Sora', sans-serif;
      --font-body: 'Noto Sans', sans-serif;
    }

    html.dark-theme {
      --bg-dark: #050D18;
      --bg-card: #0A1525;
      --border-card: rgba(150, 180, 210, 0.10);
      --border: rgba(150, 180, 210, 0.12);
      --border-subtle: rgba(150, 180, 210, 0.06);
      --teal-primary: #19C6AD;
      --teal-glow: rgba(25, 198, 173, 0.22);
      --blue-secondary: #4C8FF5;
      --purple-accent: #8174E8;
      --amber-accent: #F59E0B;
      --text: #EAF2FA;
      --text-main: #EAF2FA;
      --text-muted: #8FA2B9;
      --text-dim: #94A3B8;
      --topbar-bg: rgba(5, 13, 24, 0.88);
      --card-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.04) inset;
      --surface-1: #0A1525;
      --surface-2: #0E1B2E;
      --surface-3: #13243C;
      --surface-4: #192F4D;
      --primary: #19C6AD;
      --primary-light: #34D399;
      --primary-dim: rgba(25, 198, 173, 0.15);
    }

    body {
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* Ambient Background Glows */
    .bg-grid {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: radial-gradient(rgba(143, 162, 185, 0.07) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: radial-gradient(ellipse 85% 65% at 50% 25%, black 40%, transparent 95%);
    }

    .bg-glow-left {
      position: fixed; top: -120px; left: -100px; width: 640px; height: 640px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--teal-glow) 0%, transparent 70%);
      filter: blur(100px); pointer-events: none; z-index: 0;
      animation: floatGlowLeft 22s ease-in-out infinite alternate;
    }

    .bg-glow-right {
      position: fixed; top: 300px; right: -120px; width: 680px; height: 680px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(76, 143, 245, 0.12) 0%, transparent 70%);
      filter: blur(120px); pointer-events: none; z-index: 0;
      animation: floatGlowRight 26s ease-in-out infinite alternate;
    }

    @keyframes floatGlowLeft {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 30px) scale(1.05); }
    }
    @keyframes floatGlowRight {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-30px, -35px) scale(1.04); }
    }

    /* Executive Topbar Navigation */
    .nav {
      position: sticky !important; top: 0 !important; left: 0 !important; right: 0 !important; transform: none !important;
      width: 100% !important; max-width: 100% !important; border-radius: 0 !important;
      height: 72px !important; min-height: 72px !important; z-index: 100 !important;
      padding: 0 38px !important;
      display: flex !important; align-items: center !important; justify-content: space-between !important;
      background: var(--topbar-bg) !important;
      backdrop-filter: blur(20px) !important;
      -webkit-backdrop-filter: blur(20px) !important;
      border: none !important;
      border-bottom: 1px solid var(--border-card) !important;
      box-shadow: none !important;
      transition: background 0.3s ease, border-color 0.3s ease;
      box-sizing: border-box !important;
    }
    html.dark-theme .nav {
      background: rgba(9, 13, 22, 0.88) !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
    }

    .brand-section {
      display: flex; align-items: center; gap: 28px;
    }

    .brand {
      display: flex; align-items: center; gap: 11px;
      text-decoration: none;
      transition: transform 0.2s ease;
    }
    .brand:hover { transform: translateY(-0.5px); }

    .brand-icon {
      filter: drop-shadow(0 0 8px rgba(15, 168, 141, 0.35));
      transition: transform 0.2s ease, filter 0.2s ease;
      width: 32px !important; height: 32px !important; flex-shrink: 0 !important;
    }
    .brand:hover .brand-icon {
      transform: scale(1.05);
      filter: drop-shadow(0 0 12px rgba(15, 168, 141, 0.55));
    }

    .brand-name {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
      font-size: 20px !important;
      font-weight: 800;
      letter-spacing: -0.035em;
      color: var(--text-main);
      line-height: 1;
    }
    .brand-accent {
      background: linear-gradient(100deg, var(--teal-primary) 0%, var(--blue-secondary) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Left-Aligned Patient Navigation Tabs */
    .patient-nav-tabs {
      display: flex !important;
      align-items: center !important;
      gap: 6px !important;
      background: #ffffff !important;
      padding: 4px 6px !important;
      border-radius: 999px !important;
      border: 1px solid #dfe9ed !important;
      box-shadow: 0 4px 16px rgba(27, 67, 84, 0.06) !important;
      margin: 0 !important;
    }
    html.dark-theme .patient-nav-tabs {
      background: rgba(13, 20, 38, 0.45) !important;
      border-color: rgba(255, 255, 255, 0.1) !important;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4) !important;
    }

    .patient-nav-tab {
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 7px !important;
      padding: 6px 14px !important;
      border-radius: 999px !important;
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
      font-size: 12.5px !important;
      font-weight: 700 !important;
      line-height: 1 !important;
      color: #31445f !important;
      transition: all 0.2s ease !important;
      text-decoration: none !important;
      white-space: nowrap !important;
      box-sizing: border-box !important;
    }
    html.dark-theme .patient-nav-tab {
      color: #cbd5e1 !important;
    }
    .patient-nav-tab:hover {
      color: #0fa88d !important;
      background: rgba(15, 168, 141, 0.06) !important;
    }
    html.dark-theme .patient-nav-tab:hover {
      color: #14b8a6 !important;
      background: rgba(20, 184, 166, 0.12) !important;
    }
    .patient-nav-tab.active {
      background: linear-gradient(135deg, #0fa88d 0%, #07816e 100%) !important;
      color: #ffffff !important;
      box-shadow: 0 2px 10px rgba(15, 168, 141, 0.3) !important;
    }
    .patient-nav-tab svg {
      flex-shrink: 0 !important;
      width: 14px !important;
      height: 14px !important;
    }
    @media (max-width: 1100px) {
      .patient-nav-tabs span { display: none; }
      .patient-nav-tab { padding: 7px; }
    }
    @media (max-width: 820px) {
      .patient-nav-tabs { display: none; }
    }

    .nav-right {
      display: flex; align-items: center; gap: 12px; margin-left: auto;
    }

    /* Standardized 38px Circular Action Buttons */
    .theme-toggle-btn,
    #theme-toggle,
    #nav-notif-btn,
    .nav-icon-btn,
    .nav-refresh-btn,
    #nav-refill-btn {
      width: 38px !important; height: 38px !important;
      min-width: 38px !important; min-height: 38px !important;
      max-width: 38px !important; max-height: 38px !important;
      display: inline-flex !important; align-items: center !important; justify-content: center !important;
      border-radius: 50% !important;
      background: var(--surface-1, #ffffff) !important;
      border: 1px solid var(--border) !important;
      color: var(--text-soft, var(--text-dim)) !important;
      cursor: pointer !important;
      box-shadow: var(--shadow-sm, 0 4px 16px rgba(27, 67, 84, 0.06)) !important;
      transition: all .2s ease !important;
      flex-shrink: 0 !important;
      box-sizing: border-box !important;
      padding: 0 !important;
      position: relative !important;
      text-decoration: none !important;
    }
    /* Nav icon SVG size lock */
    .theme-toggle-btn svg, .nav-refresh-btn svg,
    #nav-notif-btn svg, #nav-refill-btn svg, .nav-icon-btn svg, #theme-toggle svg {
      display: block !important;
      flex-shrink: 0 !important;
      width: 16px !important;
      height: 16px !important;
    }
    html.dark-theme .theme-toggle-btn,
    html.dark-theme #theme-toggle,
    html.dark-theme #nav-notif-btn,
    html.dark-theme .nav-icon-btn,
    html.dark-theme .nav-refresh-btn,
    html.dark-theme #nav-refill-btn {
      background: rgba(13, 20, 38, 0.45) !important;
      border-color: rgba(255, 255, 255, 0.1) !important;
      color: #cbd5e1 !important;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4) !important;
    }
    .theme-toggle-btn:hover,
    #theme-toggle:hover,
    #nav-notif-btn:hover,
    .nav-icon-btn:hover,
    .nav-refresh-btn:hover,
    #nav-refill-btn:hover {
      border-color: rgba(15, 168, 141, 0.4) !important;
      color: var(--teal, #0fa88d) !important;
      transform: scale(1.06) !important;
    }
    html.dark-theme .sun-icon { display: block !important; }
    html.dark-theme .moon-icon { display: none !important; }
    html:not(.dark-theme) .sun-icon { display: none !important; }
    html:not(.dark-theme) .moon-icon { display: block !important; }

    /* Page Layout Container */
    .history-page-wrapper {
      max-width: 980px;
      margin: 0 auto;
      padding: 36px 28px 100px;
      position: relative;
      z-index: 1;
    }

    /* Page Header */
    .history-header {
      margin-bottom: 28px;
    }
    .history-kicker {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 4px 12px; border-radius: 9999px;
      background: var(--primary-dim);
      border: 1px solid rgba(13, 148, 136, 0.28);
      color: #0F766E; font-size: 11px; font-weight: 700;
      letter-spacing: .08em; text-transform: uppercase;
      font-family: var(--font-heading);
      margin-bottom: 12px;
    }
    html.dark-theme .history-kicker {
      border-color: rgba(25, 198, 173, 0.25);
      color: var(--primary);
    }
    .kicker-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--primary);
      box-shadow: 0 0 6px var(--primary);
      animation: pulseDot 2s infinite ease-in-out;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .page-title {
      font-family: var(--font-heading);
      font-size: 30px; font-weight: 800; letter-spacing: -.025em;
      color: var(--text-main); margin-bottom: 8px;
    }
    .page-subtitle {
      font-size: 14.5px; color: var(--text-muted); line-height: 1.55;
    }

    /* Metrics Summary Cards Grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 32px;
    }
    @media (max-width: 820px) {
      .metrics-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 480px) {
      .metrics-grid { grid-template-columns: 1fr; }
    }

    .metric-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 18px;
      padding: 20px 22px;
      box-shadow: var(--card-shadow);
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      position: relative;
      overflow: hidden;
    }
    .metric-card:hover {
      transform: translateY(-2px);
      border-color: rgba(25, 198, 173, 0.35);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
    }
    .metric-top {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    .metric-icon-wrap {
      width: 36px; height: 36px; border-radius: 10px;
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      display: flex; align-items: center; justify-content: center;
      color: var(--primary);
    }
    .metric-label {
      font-family: var(--font-heading);
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .06em; color: var(--text-muted);
    }
    .metric-val {
      font-family: var(--font-heading);
      font-size: 26px; font-weight: 800; color: var(--text-main);
      line-height: 1.1;
    }

    /* Specialty Filter Chips Bar */
    .filter-bar-wrap {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; margin-bottom: 24px; flex-wrap: wrap;
    }
    .filter-title {
      font-family: var(--font-heading);
      font-size: 13px; font-weight: 700; color: var(--text-main);
      display: flex; align-items: center; gap: 8px;
    }
    .chip-row {
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    }
    .spec-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px; border-radius: 999px; font-size: 12px; font-weight: 700;
      cursor: pointer; border: 1px solid var(--border-card);
      background: var(--surface-1); color: var(--text-muted);
      transition: all 0.2s ease; font-family: var(--font-heading);
    }
    html.dark-theme .spec-chip {
      background: var(--surface-2); border-color: var(--border);
    }
    .spec-chip:hover {
      color: var(--text-main); border-color: var(--primary);
      transform: translateY(-1px);
    }
    .spec-chip.active {
      background: linear-gradient(135deg, var(--teal-primary), #07816e);
      color: #ffffff;
      border-color: transparent;
      box-shadow: 0 4px 14px var(--teal-glow);
    }

    /* Timeline Styling */
    .timeline { position: relative; margin-top: 10px; }
    .tl-entry {
      display: grid; grid-template-columns: 92px 32px 1fr; gap: 0;
      position: relative;
    }
    @media (max-width: 650px) {
      .tl-entry { grid-template-columns: 70px 24px 1fr; }
    }

    .tl-date {
      text-align: right; padding-right: 14px; padding-top: 4px;
    }
    .tl-day {
      font-family: var(--font-heading);
      font-size: 26px; font-weight: 800; color: var(--text-main); line-height: 1;
    }
    .tl-monyear {
      font-size: 11.5px; font-weight: 600; color: var(--text-muted); margin-top: 4px;
    }

    .tl-connector {
      position: relative; display: flex; justify-content: center;
    }
    .tl-connector::before {
      content: ''; position: absolute; top: 10px; bottom: -20px; width: 2px;
      background: linear-gradient(180deg, var(--primary), rgba(25, 198, 173, 0.12));
    }
    .tl-entry:last-child .tl-connector::before { bottom: 20px; }

    .tl-dot {
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--primary);
      box-shadow: 0 0 0 4px var(--teal-glow), 0 0 10px var(--primary);
      margin-top: 6px; z-index: 1; flex-shrink: 0;
    }

    .tl-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 18px;
      padding: 22px 24px;
      margin-bottom: 22px; margin-left: 10px;
      box-shadow: var(--card-shadow);
      transition: all 0.2s ease;
    }
    .tl-card:hover {
      border-color: rgba(25, 198, 173, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.3);
    }

    .tl-doc-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-bottom: 14px;
    }
    .tl-doc-info {
      display: flex; align-items: center; gap: 12px;
    }
    .tl-avatar {
      width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg, var(--teal-primary), var(--blue-secondary));
      display: flex; align-items: center; justify-content: center;
      font-size: 13.5px; font-weight: 800; color: #ffffff;
      box-shadow: 0 2px 10px var(--teal-glow);
    }
    .tl-doc-name {
      font-family: var(--font-heading);
      font-size: 14px; font-weight: 700; color: var(--text-main);
    }
    .tl-doc-spec {
      font-size: 12px; color: var(--text-muted); font-weight: 500;
    }

    .tl-dx-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 8px;
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      color: var(--primary); font-family: var(--font-heading);
    }

    .tl-dx-title {
      font-family: var(--font-heading);
      font-size: 17px; font-weight: 800; color: var(--text-main);
      margin-bottom: 12px;
    }

    .tl-meta-row {
      display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
      padding-top: 14px; border-top: 1px solid var(--border-subtle);
    }

    .tl-rx {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--text-muted); font-weight: 600;
    }
    .tl-rx svg { color: var(--teal-primary); }

    .tl-view-btn {
      margin-left: auto;
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 14px; border-radius: 10px;
      background: var(--surface-2);
      border: 1px solid var(--border-card);
      color: var(--text-main); font-family: var(--font-heading);
      font-size: 12px; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease;
    }
    .tl-view-btn:hover {
      background: var(--primary-dim);
      border-color: var(--primary);
      color: var(--primary);
      transform: translateY(-1px);
    }

    /* Badges */
    .badge-seen {
      background: rgba(34, 197, 94, 0.12); color: #22c55e;
      border: 1px solid rgba(34, 197, 94, 0.3);
      padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .04em;
    }
    .badge-noshow {
      background: rgba(239, 68, 68, 0.12); color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .04em;
    }
    .badge-upcoming {
      background: rgba(14, 165, 233, 0.12); color: #0ea5e9;
      border: 1px solid rgba(14, 165, 233, 0.3);
      padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .04em;
    }

    /* Empty Glass State Card */
    .empty-glass-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 24px;
      padding: 64px 32px;
      text-align: center;
      box-shadow: var(--card-shadow);
      position: relative;
      overflow: hidden;
      margin-top: 12px;
    }
    .empty-icon-shield {
      width: 72px; height: 72px; border-radius: 20px;
      background: linear-gradient(135deg, rgba(25, 198, 173, 0.18) 0%, rgba(76, 143, 245, 0.12) 100%);
      border: 1px solid rgba(25, 198, 173, 0.3);
      display: flex; align-items: center; justify-content: center;
      color: var(--primary); margin: 0 auto 20px;
      box-shadow: 0 8px 24px var(--teal-glow);
    }
    .empty-glass-title {
      font-family: var(--font-heading);
      font-size: 20px; font-weight: 800; color: var(--text-main);
      margin-bottom: 8px; letter-spacing: -.01em;
    }
    .empty-glass-desc {
      font-size: 14px; color: var(--text-muted); line-height: 1.6;
      max-width: 480px; margin: 0 auto 28px;
    }
    .empty-actions-row {
      display: flex; align-items: center; justify-content: center; gap: 14px;
      flex-wrap: wrap;
    }
    .empty-primary-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 11px 22px; border-radius: 12px;
      background: linear-gradient(135deg, #0fa88d 0%, #07816e 100%);
      color: #ffffff; font-family: var(--font-heading); font-size: 13px; font-weight: 700;
      text-decoration: none; box-shadow: 0 4px 18px var(--teal-glow);
      transition: all 0.2s ease;
    }
    .empty-primary-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 22px rgba(15, 168, 141, 0.45);
    }
    .empty-secondary-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 11px 20px; border-radius: 12px;
      background: var(--surface-2); border: 1px solid var(--border-card);
      color: var(--text-main); font-family: var(--font-heading); font-size: 13px; font-weight: 700;
      text-decoration: none; transition: all 0.2s ease;
    }
    .empty-secondary-btn:hover {
      background: var(--surface-3); border-color: var(--primary);
      transform: translateY(-1px);
    }

    /* Loading Spinner */
    .thinking-row {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      padding: 60px 20px; color: var(--text-muted); font-size: 14px; font-weight: 600;
    }
    .spinner {
      width: 22px; height: 22px; border-radius: 50%;
      border: 2.5px solid var(--border-subtle);
      border-top-color: var(--primary);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- Ambient Grid & Glow Effects -->
<div class="bg-grid"></div>
<div class="bg-glow-left"></div>
<div class="bg-glow-right"></div>

<!-- Top Executive Navigation Bar -->
<nav class="nav">
  <div class="brand-section">
    <a href="/patient-overview.html" class="brand" title="DiffDx Overview">
      <svg class="brand-icon" width="32" height="32" viewBox="0 0 28 28" fill="none">
        <defs>
          <linearGradient id="hh-ring" x1="0" y1="0" x2="28" y2="28" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#0fa88d" />
            <stop offset="100%" stop-color="#2879d8" />
          </linearGradient>
          <linearGradient id="hh-ft" x1="13" y1="14" x2="19" y2="8" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#0fa88d" />
            <stop offset="100%" stop-color="#14b8a6" />
          </linearGradient>
          <linearGradient id="hh-fb" x1="13" y1="14" x2="19" y2="20" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#0fa88d" />
            <stop offset="100%" stop-color="#2879d8" />
          </linearGradient>
        </defs>
        <circle cx="14" cy="14" r="12.5" stroke="url(#hh-ring)" stroke-width="1.3" fill="rgba(15,168,141,.08)" />
        <line x1="6" y1="14" x2="13" y2="14" stroke="#0fa88d" stroke-width="2" stroke-linecap="round" />
        <path d="M13 14 L19 8.5" stroke="url(#hh-ft)" stroke-width="2" stroke-linecap="round" />
        <path d="M13 14 L19 19.5" stroke="url(#hh-fb)" stroke-width="2" stroke-linecap="round" />
        <circle cx="20" cy="8.5" r="2" fill="#14b8a6" />
        <circle cx="20" cy="19.5" r="2" fill="#2879d8" />
      </svg>
      <span class="brand-name">Diff<span class="brand-accent">/Dx</span></span>
    </a>

    <!-- Left-Aligned Patient Navigation Tabs -->
    <div class="patient-nav-tabs patient-topbar-tabs" id="patient-nav-tabs">
      <a href="/patient-overview.html" class="patient-nav-tab patient-topbar-tab">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Overview</span>
      </a>
      <a href="/my-sessions.html" class="patient-nav-tab patient-topbar-tab">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span>Sessions</span>
      </a>
      <a href="/messages.html" class="patient-nav-tab patient-topbar-tab">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>Messages</span>
      </a>
      <a href="/book-slot.html" class="patient-nav-tab patient-topbar-tab">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span>Book</span>
      </a>
      <a href="/health-history.html" class="patient-nav-tab patient-topbar-tab active">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 15"/></svg>
        <span>History</span>
      </a>
      <a href="/my-profile.html" class="patient-nav-tab patient-topbar-tab">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Profile</span>
      </a>
    </div>
  </div>

  <div class="nav-right">
    <button id="theme-toggle" class="theme-toggle-btn" onclick="toggleTheme()" aria-label="Toggle theme" title="Toggle theme">
      <svg class="sun-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <svg class="moon-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
    <div id="nav-auth" style="display:flex;align-items:center;gap:8px;"></div>
  </div>
</nav>

<!-- Page Body -->
<main class="history-page-wrapper">
  <!-- Header -->
  <header class="history-header">
    <h1 class="page-title">Health & Consultation History</h1>
    <p class="page-subtitle" id="hh-count">Review your diagnostic encounters, verified specialist appointments, and prescribed medications.</p>
  </header>

  <!-- Summary Stat Cards -->
  <section class="metrics-grid">
    <div class="metric-card">
      <div class="metric-top">
        <span class="metric-label">Consultations</span>
        <div class="metric-icon-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        </div>
      </div>
      <div class="metric-val" id="stat-visits">0</div>
    </div>

    <div class="metric-card">
      <div class="metric-top">
        <span class="metric-label">Diagnoses</span>
        <div class="metric-icon-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
        </div>
      </div>
      <div class="metric-val" id="stat-dx">0</div>
    </div>

    <div class="metric-card">
      <div class="metric-top">
        <span class="metric-label">Prescriptions</span>
        <div class="metric-icon-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/></svg>
        </div>
      </div>
      <div class="metric-val" id="stat-rx">0</div>
    </div>

    <div class="metric-card">
      <div class="metric-top">
        <span class="metric-label">Specialists</span>
        <div class="metric-icon-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </div>
      </div>
      <div class="metric-val" id="stat-docs">0</div>
    </div>
  </section>

  <!-- Filter Row -->
  <section class="filter-bar-wrap" id="filter-section" style="display:none;">
    <div class="filter-title">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
      <span>Filter Specialty</span>
    </div>
    <div class="chip-row" id="spec-chips"></div>
  </section>

  <!-- Timeline / Empty Container -->
  <section id="timeline-container">
    <div class="thinking-row" id="hh-spinner">
      <div class="spinner"></div>
      <span>Loading clinical history…</span>
    </div>
  </section>
</main>

<script>
const user = getAuthUser();
if (!user) window.location.replace('/login.html?next=/health-history.html');

function toggleTheme() {
  const isDark = document.documentElement.classList.toggle('dark-theme');
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}

let _history = [];
let _activeSpec = 'All';

function escHtml(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function initials(name) {
  return (name || 'D').replace(/^Dr\.?\s*/i,'').split(' ').map(n=>n[0]).join('').slice(0,2).toUpperCase();
}

function statusBadge(s) {
  if (s === 'seen') return `<span class="badge-seen">Completed</span>`;
  if (s === 'no_show') return `<span class="badge-noshow">No-show</span>`;
  return `<span class="badge-upcoming">Upcoming</span>`;
}

function updateStats() {
  const visits = _history.length;
  const dx = _history.filter(h => h.primary_diagnosis).length;
  const rx = _history.reduce((acc, h) => acc + ((h.prescriptions || []).length), 0);
  const docs = new Set(_history.map(h => h.doctor_name).filter(Boolean)).size;

  document.getElementById('stat-visits').textContent = visits;
  document.getElementById('stat-dx').textContent = dx;
  document.getElementById('stat-rx').textContent = rx;
  document.getElementById('stat-docs').textContent = docs;
}

function renderChips() {
  const specs = ['All', ...Array.from(new Set(_history.map(h => h.specialty).filter(Boolean)))];
  const filterSec = document.getElementById('filter-section');
  if (specs.length <= 1) {
    if (filterSec) filterSec.style.display = 'none';
    return;
  }
  if (filterSec) filterSec.style.display = 'flex';

  document.getElementById('spec-chips').innerHTML = specs.map(s =>
    `<span class="spec-chip ${s === _activeSpec ? 'active' : ''}" onclick="setSpec('${escHtml(s).replace(/'/g,"\\'")}')">${escHtml(s)}</span>`
  ).join('');
}

function setSpec(s) {
  _activeSpec = s;
  renderChips();
  renderTimeline();
}

function renderTimeline() {
  const container = document.getElementById('timeline-container');
  const entries = _activeSpec === 'All' ? _history : _history.filter(h => h.specialty === _activeSpec);

  if (entries.length === 0) {
    container.innerHTML = `
      <div class="empty-glass-card">
        <div class="empty-icon-shield">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
            <path d="M12 5v14"/>
          </svg>
        </div>
        <h3 class="empty-glass-title">No Clinical Encounters Recorded Yet</h3>
        <p class="empty-glass-desc">Your clinical diagnostic records, verified physician assessments, and electronic prescriptions will be automatically catalogued here chronologically.</p>
        <div class="empty-actions-row">
          <a href="/patient-info" class="empty-primary-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
            Start AI Diagnosis
          </a>
          <a href="/find-doctors.html" class="empty-secondary-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            Browse Specialists
          </a>
        </div>
      </div>
    `;
    return;
  }

  container.innerHTML = `<div class="timeline">${entries.map(e => {
    const d = e.slot ? new Date(e.slot) : null;
    const day = d ? d.getDate() : '—';
    const monyear = d ? d.toLocaleDateString('en-US',{month:'short',year:'numeric'}) : '';
    const rxCount = (e.prescriptions || []).length;
    const canView = !!e.session_id;

    return `
    <div class="tl-entry">
      <div class="tl-date">
        <div class="tl-day">${day}</div>
        <div class="tl-monyear">${monyear}</div>
      </div>
      <div class="tl-connector"><div class="tl-dot"></div></div>
      <div class="tl-card">
        <div class="tl-doc-row">
          <div class="tl-doc-info">
            <div class="tl-avatar">${initials(e.doctor_name)}</div>
            <div>
              <div class="tl-doc-name">${escHtml(e.doctor_name || 'Verified Physician')}</div>
              <div class="tl-doc-spec">${escHtml(e.specialty || 'General Practice')}</div>
            </div>
          </div>
          ${e.specialty ? `<span class="tl-dx-badge">${escHtml(e.specialty)}</span>` : ''}
        </div>

        <div class="tl-dx-title">${escHtml(e.primary_diagnosis || 'Clinical Consultation')}</div>

        <div class="tl-meta-row">
          ${statusBadge(e.status)}
          <span class="tl-rx">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/></svg>
            ${rxCount} prescription${rxCount !== 1 ? 's' : ''}
          </span>
          ${canView ? `<button class="tl-view-btn" onclick="viewReport('${e.session_id}')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg> View Report</button>` : ''}
        </div>
      </div>
    </div>`;
  }).join('')}</div>`;
}

function viewReport(sessionId) {
  sessionStorage.setItem('sessionId', sessionId);
  window.location.href = '/report.html';
}

async function load() {
  const container = document.getElementById('timeline-container');
  const spinnerTimeout = setTimeout(() => {
    const sp = document.getElementById('hh-spinner');
    if (sp) sp.innerHTML = '<span style="color:var(--text-muted);font-size:13px;">Taking longer than expected… please wait.</span>';
  }, 6000);

  try {
    const res = await fetch('/api/patient/history', { headers: { ...authHeaders() } });
    clearTimeout(spinnerTimeout);
    if (!res.ok) {
      if (res.status === 401) { clearAuth(); window.location.replace('/login.html'); return; }
      throw new Error(await res.text());
    }
    const data = await res.json();
    _history = data.history || [];
    const countEl = document.getElementById('hh-count');
    if (countEl) {
      countEl.textContent =
        _history.length === 0 ? 'No historical visits recorded yet.' :
        _history.length === 1 ? '1 clinical consultation on file.' :
        `${_history.length} clinical consultations on file.`;
    }
    updateStats();
    renderChips();
    renderTimeline();
  } catch (e) {
    clearTimeout(spinnerTimeout);
    container.innerHTML = `<div class="empty-glass-card"><p style="color:#ef4444;font-weight:600;">Error loading clinical history: ${escHtml(e.message)}</p></div>`;
  }
}

// Initialise page
initAuthNav();
load();
</script>
</body>
</html>
