<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1580 1200" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1580" height="1200" fill="#0a0a0d"/>

  <!-- ============ connectors (drawn first, under nodes) ============ -->
  <g fill="none" stroke="#4b5060" stroke-width="1.6">
    <!-- Loop 1 vertical spine -->
    <path d="M390,150 V210" marker-end="url(#arrow)"/>
    <path d="M390,520 V575" marker-end="url(#arrow)"/>
    <path d="M390,665 V720" marker-end="url(#arrow)"/>
    <path d="M390,810 V880" marker-end="url(#arrow)"/>
    <path d="M390,1040 V1060" marker-end="url(#arrow)"/>
    <!-- Compression / ICL retrieval feeding into Prompt assembly rows 2 and 3 -->
    <path d="M200,315 H214 V346 H228" marker-end="url(#arrow)"/>
    <path d="M200,425 H214 V408 H228" marker-end="url(#arrow)"/>
    <!-- Stop? "no" loop back to Prompt assembly -->
    <path d="M545,960 H660 V365 H580" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
    <text x="555" y="948" font-size="12" fill="#c9a227">no · next turn</text>
    <text x="405" y="1053" font-size="12" fill="#c9a227">yes</text>

    <!-- Loop 2 spine -->
    <path d="M1180,175 V245" marker-end="url(#arrow)"/>
    <path d="M1180,335 V380 H1000 V435" marker-end="url(#arrow)"/>
    <path d="M1180,335 V380 H1360 V435" marker-end="url(#arrow)"/>
    <path d="M1000,525 V560 H1180 V595" marker-end="url(#arrow)"/>
    <path d="M1360,525 V560 H1180 V595" marker-end="url(#arrow)"/>
    <path d="M1180,685 V715 H1000 V745" marker-end="url(#arrow)"/>
    <!-- Exemplar bank feedback into Loop 1 retrieval -->
    <path d="M860,790 H700 V130 H780" stroke-dasharray="5,5" marker-end="url(#arrow)"/>

    <!-- link between the two panels: this turn's actor JSON -> critic's turn input -->
    <path d="M580,765 H700 V130 H985" stroke-dasharray="3,5"/>
  </g>

  <text x="1560" y="60" text-anchor="end" font-size="12" fill="#3ba97e">next turn</text>

  <!-- ============ Loop 1 panel ============ -->
  <text x="390" y="35" text-anchor="middle" font-size="16" font-weight="700" fill="#e8e8ee">Loop 1 — Actor: one turn</text>

  <!-- Patient profile -->
  <g>
    <rect x="200" y="80" width="380" height="70" rx="10" fill="#17171c" stroke="#3a3a45"/>
    <text x="390" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#eee">Patient profile</text>
    <text x="390" y="130" text-anchor="middle" font-size="12" fill="#9aa0ac">complaint · symptoms · history</text>
  </g>

  <!-- Compression -->
  <g>
    <rect x="20" y="280" width="180" height="70" rx="10" fill="#9fe0c2" stroke="#3ba97e"/>
    <text x="110" y="308" text-anchor="middle" font-size="14" font-weight="700" fill="#0d2818">Compression</text>
    <text x="110" y="328" text-anchor="middle" font-size="11" fill="#0d2818">running summary</text>
  </g>

  <!-- ICL retrieval -->
  <g>
    <rect x="20" y="390" width="180" height="70" rx="10" fill="#9fe0c2" stroke="#3ba97e"/>
    <text x="110" y="418" text-anchor="middle" font-size="14" font-weight="700" fill="#0d2818">ICL retrieval</text>
    <text x="110" y="438" text-anchor="middle" font-size="11" fill="#0d2818">FAISS + MMR</text>
  </g>

  <!-- Prompt assembly -->
  <g>
    <rect x="200" y="210" width="380" height="310" rx="12" fill="#b6a8ec" stroke="#7c5cd6" stroke-width="2"/>
    <text x="390" y="240" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a2e">Prompt assembly</text>
    <g font-size="13" fill="#241f3d">
      <rect x="228" y="258" width="324" height="52" rx="8" fill="#cfc3f4"/>
      <text x="390" y="289" text-anchor="middle" font-weight="600">1 · System role</text>
      <rect x="228" y="320" width="324" height="52" rx="8" fill="#cfc3f4"/>
      <text x="390" y="351" text-anchor="middle" font-weight="600">2 · Compressed context</text>
      <rect x="228" y="382" width="324" height="52" rx="8" fill="#cfc3f4"/>
      <text x="390" y="413" text-anchor="middle" font-weight="600">3 · ICL exemplars ×3</text>
      <rect x="228" y="444" width="324" height="52" rx="8" fill="#cfc3f4"/>
      <text x="390" y="475" text-anchor="middle" font-weight="600">4 · Live turn history</text>
    </g>
  </g>

  <!-- Actor LLM -->
  <g>
    <rect x="200" y="575" width="380" height="90" rx="12" fill="#aad4f6" stroke="#3b7dc9" stroke-width="2"/>
    <text x="390" y="627" text-anchor="middle" font-size="17" font-weight="700" fill="#0d1a2e">Actor LLM</text>
  </g>

  <!-- Structured JSON -->
  <g>
    <rect x="200" y="720" width="380" height="90" rx="10" fill="#17171c" stroke="#3a3a45"/>
    <text x="390" y="757" text-anchor="middle" font-size="15" font-weight="700" fill="#eee">Structured JSON</text>
    <text x="390" y="780" text-anchor="middle" font-size="12" fill="#9aa0ac">dx · question · confidence</text>
  </g>

  <!-- Stop diamond -->
  <g>
    <polygon points="390,880 545,960 390,1040 235,960" fill="#f6cf7c" stroke="#d69e1f" stroke-width="2"/>
    <text x="390" y="953" text-anchor="middle" font-size="15" font-weight="700" fill="#2e2308">Stop?</text>
    <text x="390" y="973" text-anchor="middle" font-size="11" fill="#2e2308">conf &gt; 0.75 or 15 turns</text>
  </g>

  <!-- Session saved -->
  <g>
    <rect x="200" y="1060" width="380" height="90" rx="10" fill="#17171c" stroke="#3a3a45"/>
    <text x="390" y="1098" text-anchor="middle" font-size="15" font-weight="700" fill="#eee">Session saved</text>
    <text x="390" y="1121" text-anchor="middle" font-size="12" fill="#9aa0ac">PostgreSQL → Loop 2</text>
  </g>

  <!-- ============ Loop 2 panel ============ -->
  <text x="1180" y="35" text-anchor="middle" font-size="16" font-weight="700" fill="#e8e8ee">Loop 2 — Critic: scores each turn</text>

  <!-- Loop 1 retrieval (exemplar bank) -->
  <g>
    <rect x="780" y="85" width="180" height="90" rx="10" fill="#9fe0c2" stroke="#3ba97e"/>
    <text x="870" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#0d2818">Loop 1 retrieval</text>
    <text x="870" y="145" text-anchor="middle" font-size="11" fill="#0d2818">exemplar bank</text>
  </g>

  <!-- Actor turn output -->
  <g>
    <rect x="985" y="85" width="390" height="90" rx="10" fill="#17171c" stroke="#3a3a45"/>
    <text x="1180" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#eee">Actor turn output</text>
    <text x="1180" y="145" text-anchor="middle" font-size="11" fill="#9aa0ac">structured JSON, turn N</text>
  </g>

  <!-- Critic LLM -->
  <g>
    <rect x="997" y="245" width="365" height="90" rx="12" fill="#eabaa9" stroke="#c9694f" stroke-width="2"/>
    <text x="1180" y="283" text-anchor="middle" font-size="15" font-weight="700" fill="#2e150d">Critic LLM</text>
    <text x="1180" y="305" text-anchor="middle" font-size="11" fill="#2e150d">scores each turn · Gemma</text>
  </g>

  <!-- Turn score -->
  <g>
    <rect x="860" y="435" width="280" height="90" rx="10" fill="#17171c" stroke="#3a3a45"/>
    <text x="1000" y="473" text-anchor="middle" font-size="14" font-weight="700" fill="#eee">Turn score</text>
    <text x="1000" y="495" text-anchor="middle" font-size="11" fill="#9aa0ac">relevance · diff · reason</text>
  </g>

  <!-- Safety flag -->
  <g>
    <rect x="1220" y="435" width="280" height="90" rx="10" fill="#f6cf7c" stroke="#d69e1f" stroke-width="2"/>
    <text x="1360" y="473" text-anchor="middle" font-size="14" font-weight="700" fill="#2e2308">Safety flag</text>
    <text x="1360" y="495" text-anchor="middle" font-size="11" fill="#2e2308">red-flag check</text>
  </g>

  <!-- Accumulated scores -->
  <g>
    <rect x="997" y="595" width="365" height="90" rx="10" fill="#17171c" stroke="#3a3a45"/>
    <text x="1180" y="633" text-anchor="middle" font-size="14" font-weight="700" fill="#eee">Accumulated scores</text>
    <text x="1180" y="655" text-anchor="middle" font-size="11" fill="#9aa0ac">across all turns</text>
  </g>

  <!-- Exemplar bank -->
  <g>
    <rect x="860" y="745" width="280" height="90" rx="10" fill="#9fe0c2" stroke="#3ba97e"/>
    <text x="1000" y="783" text-anchor="middle" font-size="14" font-weight="700" fill="#0d2818">Exemplar bank</text>
    <text x="1000" y="805" text-anchor="middle" font-size="11" fill="#0d2818">high-scoring sessions</text>
  </g>

  <!-- Legend -->
  <text x="790" y="1150" text-anchor="middle" font-size="13" fill="#8a8f9c">coral = critic (per turn) · amber = safety flag · teal = feedback into Loop 1</text>
</svg>
